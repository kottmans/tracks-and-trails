[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracks-and-trails"
description = "A desktop GUI for yt-dlp, for Linux and Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Kottman" }]
requires-python = ">=3.14"
dynamic = ["version"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

# Runtime dependencies. Per AGENTS.md §7, each is backed by an accepted decision:
#   PySide6      ARC-001    platformdirs  DAT-001
#   yt-dlp       ARC-002 / OPS-002
# yt-dlp is pinned exactly, not floated: OPS-002 requires a pinned, tested baseline so
# behavior is reproducible. Users update their own copy out-of-band instead.
dependencies = [
    "PySide6>=6.11,<7",
    "platformdirs>=4.0",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = [
    # T-026: reads the UI Automation tree — what Narrator actually announces — rather than Qt's
    # own QAccessible view, which would be Qt reporting on itself. Windows-only by nature.
    # Dev-only tooling, so no DECISIONS entry is required (AGENTS.md §7).
    "comtypes>=1.4; sys_platform == 'win32'",
    "mypy>=1.14",
    # Used only by packaging/frozen_smoke.py, to assert no process survives the T-020 frozen
    # run. Dev-only tooling, so no DECISIONS entry is required (AGENTS.md §7).
    "psutil>=6.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.9",
]
build = ["pyinstaller>=6.21"]

[project.scripts]
tracks-and-trails = "tracks_and_trails.__main__:main"

[project.urls]
Repository = "https://github.com/kottmans/tracks-and-trails"
Issues = "https://github.com/kottmans/tracks-and-trails/issues"

[tool.hatch.version]
path = "src/tracks_and_trails/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracks_and_trails"]


# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib -- cross-platform path handling matters here (NFR-004)
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "S101",  # assert: fine in tests, and used for invariants
]

[tool.ruff.lint.per-file-ignores]
# Qt's API is camelCase; overridden virtuals cannot be renamed to satisfy N802.
"src/tracks_and_trails/ui/*" = ["N802"]
# Tests deliberately shell out to the interpreter under test and touch the network.
# S301: round-tripping models through pickle is not incidental — ARC-002 sends every domain
# type to a spawned worker, so T-010 requires it asserted per type. The data is constructed in
# the test one line above; there is no untrusted input anywhere near it.
"tests/*" = ["S301", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["tracks_and_trails"]


# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# yt-dlp ships no type information. Confined here deliberately: only worker.py and
# ytdlp_adapter.py may import it (ARCHITECTURE.md §6), so the untyped surface stays small.
module = ["yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# T-026's Windows-only test modules. On a Linux checkout mypy correctly proves everything after
# their `sys.platform != "win32"` guard unreachable, then reports the Windows-only `ctypes.windll`
# and `comtypes` as missing and their `type: ignore`s as unused. All three are artefacts of
# checking Windows code on Linux and say nothing about whether the code is right — that question
# is answered by the `windows desktop` CI job, not here.
module = ["tests.ui.test_windows_desktop", "tests.ui.test_windows_accessibility"]
ignore_missing_imports = true
warn_unreachable = false
disable_error_code = ["unused-ignore", "import-not-found", "unreachable"]


# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are excluded by default (TESTING.md §2). An explicit `-m` on the command
# line overrides this, which is how `pytest -m network` opts back in.
#
# windows_desktop is excluded for a different reason. Those tests require the real `windows`
# platform plugin and *fail* rather than skip under the offscreen one, which is deliberate —
# a silent skip would leave their job green while proving nothing. But the default suite runs
# offscreen everywhere, including on the Windows `check` job, where the off-Windows module
# skip does not apply. Without this they would run offscreen there and fail correctly but
# uselessly. `pytest -m windows_desktop` opts back in, and is what the dedicated job runs.
addopts = "-m 'not network and not windows_desktop' --strict-markers --strict-config"
markers = [
    "network: hits the real network and real sites; excluded from the default run",
    "windows_desktop: requires a real Windows desktop session (no offscreen platform plugin)",
]

[tool.coverage.run]
source = ["src/tracks_and_trails"]
branch = true
