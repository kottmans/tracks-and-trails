# Commit-message gate — `T-240`.
#
# **This runs on every push, with no `paths` filter, and that is the point.** `ci.yml` exempts
# prose (`OPS-011`) and `prose.yml` covers only `ai/TASKS.md`; a commit message has nothing to do
# with which files a commit touched, and the commits most likely to omit a `Task:` trailer —
# status syncs, review records — are exactly the prose-only ones neither of those workflows would
# examine.
#
# **It no longer runs on pull requests** (`T-262`, 2026-08-17), and this header said it did for one
# commit after the trigger was removed — `T262-R1`. See the `on:` block below for why the absence
# is a control rather than a gap.
#
# ## What this can and cannot do
#
# **It reports; it does not prevent.** By the time this runs the history exists, which is precisely
# the state `T-065` had to preserve rather than fix when `12dff92` reached `origin/main`. The half
# that prevents is `.githooks/commit-msg`, which refuses the commit while amending is still free —
# and which can be skipped with `--no-verify` and does not exist in a fresh clone until
# `tools/install-hooks.sh` is run.
#
# Neither half is sufficient. The hook catches the defect at the only moment it is cheap; this
# catches the defect the hook was not installed to see. `T-240`'s entry asks for that difference to
# be stated rather than blurred, so it is stated here and in the checker's own docstring.
#
# ## Only the pushed range
#
# The range is what arrived, never the whole history. 278 of this repository's 915 commits predate
# the `Task:` requirement and would fail this check; re-litigating them is out of scope by `T-240`
# and forbidden in `12dff92`'s case by `T-065`. A gate that fails every run for a reason nobody is
# allowed to fix is a gate that gets switched off.

name: Commit messages

on:
  push:
  # **No `pull_request:` trigger, and its absence is a security control** (`T-262`).
  # Every job in this repository resolves to a **self-hosted runner** while `LINUX_RUNNER`,
  # `WINDOWS_RUNNER` and `STARBASE_AVAILABLE` are set, and GitHub runs fork pull requests with
  # the fork's own code. In a public repository that is arbitrary code execution on the
  # maintainer's Fedora machine and on `STARBASE`, gated only by a fork-approval setting that
  # auto-approves anyone with one merged pull request.
  #
  # Nothing is given up: `AGENTS.md` §7 makes this a one-checkout, one-writer project that
  # commits straight to `main`, and a branch requires explicit instruction. **Restoring this
  # trigger requires gating every self-hosted job** on
  # `github.event.pull_request.head.repo.full_name == github.repository`, not just adding the
  # line back.

# **A push run is never cancelled or replaced by a later push** (`T240-R2`, twice). The first
# instance grouped by ref with `cancel-in-progress: true`: push B cancelled the run that held
# push A's bad commit, while B's own range started at A's head — so A's commits were read by
# nothing. The correction grouped pushes by `github.sha`, and that was the second instance:
# **a push SHA is not a unique run identifier**. Different ref updates can end at the same
# commit and collide in one group, and GitHub replaces an existing **pending** run when another
# enters the same group even with `cancel-in-progress: false`. The reviewer's probe: three real
# ranges sharing one after-SHA scored 0, 1, 0 — only the middle held the malformed commit, and a
# third same-SHA run would have replaced it while pending, losing the only evidence.
#
# `github.run_id` is documented unique per run, which makes the push group collision-free **by
# construction** rather than by the shapes pushes happen to take.
#
# **The `pull_request` half below is dormant, not live** (`T-262`). It is kept as restoration
# scaffolding rather than deleted, because it is the half that would be needed again and its
# reasoning is not recoverable from the expression: a synchronize run's `base..head` covers every
# commit the merge would bring, so a replacement run covers its cancelled predecessor — the
# property the push side lacks, and the reason the two branches differ at all. **Restoring the
# trigger takes more than this expression** — see the `on:` block. The wiring is pinned as text by
# `tests/unit/test_commit_message_check.py`, comments stripped first, which is why the branch also
# cannot be simplified away without touching that test.
concurrency:
  group: commit-messages-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trailers:
    name: trailers
    # Follows `LINUX_RUNNER` like everything else Linux (`OPS-012`). Unset means hosted.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      # **Full history.** The default depth of 1 cannot resolve a range at all, and the range is
      # the whole job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `setup-python`, hosted or not: the checker imports `argparse`, `json`, `re`,
      # `subprocess`, `dataclasses` and nothing else, so whatever `python3` the runner has is
      # enough. This is also what lets `.githooks/commit-msg` run before a virtualenv exists.
      #
      # **Working out which commits arrived is the checker's job, not this file's** (`T240-R1`,
      # second round). It was twenty lines of `bash` here, and both of the finding's bypasses lived
      # in them: a pull request was checked with `--no-merges`, which skipped the merges a person
      # wrote along with GitHub's synthetic one, and the no-usable-`before` fallback resolved to an
      # empty range whenever the push went to the default branch. Neither could be tested where it
      # was written. `select_range` is that decision in Python, with the event payload as its
      # input, and `tests/unit/test_commit_message_check.py` drives it with the payload shapes
      # GitHub actually sends — including the force-push that produced the empty range.
      - name: Check the trailers on what arrived
        run: |
          # **`pipefail`, because the check's exit code is the whole result.** Without it `tee`
          # reports success and the gate passes while printing its own failures — the same shape
          # `ai/TESTING.md` records for chaining validation into a commit.
          set -o pipefail
          mkdir -p reports
          python3 tools/commit_message_check.py \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            2>&1 | tee reports/commit-messages.txt

      # Matches the standing rule in `ci.yml` and `prose.yml`: every job leaves its evidence
      # behind, pass or fail.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-commit-messages
          path: reports/
          retention-days: 30
