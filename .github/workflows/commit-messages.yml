# Commit-message gate — `T-240`.
#
# **This runs on every push and every pull request, with no `paths` filter, and that is the point.**
# `ci.yml` exempts prose (`OPS-011`) and `prose.yml` covers only `ai/TASKS.md`; a commit message
# has nothing to do with which files a commit touched, and the commits most likely to omit a
# `Task:` trailer — status syncs, review records — are exactly the prose-only ones neither of those
# workflows would examine.
#
# ## What this can and cannot do
#
# **It reports; it does not prevent.** By the time this runs the history exists, which is precisely
# the state `T-065` had to preserve rather than fix when `12dff92` reached `origin/main`. The half
# that prevents is `.githooks/commit-msg`, which refuses the commit while amending is still free —
# and which can be skipped with `--no-verify` and does not exist in a fresh clone until
# `tools/install-hooks.sh` is run.
#
# Neither half is sufficient. The hook catches the defect at the only moment it is cheap; this
# catches the defect the hook was not installed to see. `T-240`'s entry asks for that difference to
# be stated rather than blurred, so it is stated here and in the checker's own docstring.
#
# ## Only the pushed range
#
# The range is what arrived, never the whole history. 278 of this repository's 915 commits predate
# the `Task:` requirement and would fail this check; re-litigating them is out of scope by `T-240`
# and forbidden in `12dff92`'s case by `T-065`. A gate that fails every run for a reason nobody is
# allowed to fix is a gate that gets switched off.

name: Commit messages

on:
  push:
  pull_request:

concurrency:
  group: commit-messages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trailers:
    name: trailers
    # Follows `LINUX_RUNNER` like everything else Linux (`OPS-012`). Unset means hosted.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      # **Full history.** The default depth of 1 cannot resolve a range at all, and the range is
      # the whole job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `setup-python`, hosted or not: the checker imports `argparse`, `re`, `subprocess`,
      # `dataclasses` and nothing else, so whatever `python3` the runner has is enough. This is
      # also what lets `.githooks/commit-msg` run before a virtualenv exists.
      - name: Work out what arrived
        id: range
        run: |
          set -o pipefail
          before='${{ github.event.before }}'
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.sha }}'
          default='${{ github.event.repository.default_branch }}'
          zero='0000000000000000000000000000000000000000'
          skip_merges=false

          if [ -n "$base" ]; then
            # **A pull request.** `github.sha` is a merge of the branch into its base that GitHub
            # synthesises — nobody authored it and nobody can amend its message — so it is the one
            # case where merges are excluded, and `--skip-merges` is passed for this event alone
            # rather than being a default that covered every case (`T240-R1`).
            range="$base..$head"
            skip_merges=true
          elif [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
            # **An ordinary push.** Merges are included: a merge commit's message can carry an AI
            # trailer or omit `Task:` exactly like any other.
            range="$before..$head"
          elif [ -n "$default" ] && git rev-parse --verify -q "origin/$default" >/dev/null; then
            # **A new branch, a force-push, or a re-pushed tag** — `before` is absent or no longer
            # resolvable. The determinable set is everything the tip adds over the default branch,
            # which is what "what arrived" means for a branch that did not exist before. This is
            # the case the previous version got wrong: it checked `$head~1..$head`, so every commit
            # in a new branch except the last was pushed unread.
            range="origin/$default..$head"
            echo "::notice::No usable before-SHA; checking everything $head adds over $default."
          else
            # Nothing to compare against — a first push to an empty repository, or a clone with no
            # default branch. The tip is all there is, and saying so beats implying more.
            range="$head~1..$head"
            echo "::notice::No before-SHA and no default branch; checking the tip commit only."
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "skip_merges=$skip_merges" >> "$GITHUB_OUTPUT"
          echo "range: $range (skip_merges=$skip_merges)"
          git rev-list --count "$range" | sed 's/^/commits in range: /'

      - name: Check the trailers on what arrived
        run: |
          # **`pipefail`, because the check's exit code is the whole result.** Without it `tee`
          # reports success and the gate passes while printing its own failures — the same shape
          # `ai/TESTING.md` records for chaining validation into a commit.
          set -o pipefail
          mkdir -p reports
          skip=""
          if [ '${{ steps.range.outputs.skip_merges }}' = "true" ]; then
            skip="--skip-merges"
          fi
          python3 tools/commit_message_check.py \
            --range '${{ steps.range.outputs.range }}' $skip \
            2>&1 | tee reports/commit-messages.txt

      # Matches the standing rule in `ci.yml` and `prose.yml`: every job leaves its evidence
      # behind, pass or fail.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-commit-messages
          path: reports/
          retention-days: 30
