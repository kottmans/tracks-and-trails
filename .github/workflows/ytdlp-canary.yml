# yt-dlp canary — `T-291`.
#
# **The detectors already existed; nothing ever fed them a newer version.**
#
# Three gates in this suite fail when yt-dlp's own surface moves:
#
#   - `tests/unit/test_post_processing_options.py` holds `CONTAINER_FORMATS` **equal** to
#     `FFmpegVideoRemuxer.SUPPORTED_EXTS` and `FFmpegVideoConvertor.SUPPORTED_EXTS`, and
#     `AUDIO_ONLY_CONTAINERS` equal to yt-dlp's own audio classification.
#   - `tests/unit/test_option_audit.py` calls the real `create_parser()` and asserts every
#     documented option is classified exactly once, in both directions.
#   - the same file asserts the audit records the version it was taken against.
#
# Every one of them only ever saw the pin, because every job installs from `pyproject.toml` and
# `ci.yml`'s nightly reinstalls it. That nightly answers a different question — a re-resolved
# dependency, a runner OS update, the desktop machine drifting — which is environment drift, not
# upstream drift. **So the first thing to run this code against a new yt-dlp was a user pressing
# Update**, which `OPS-002` exists to encourage and its 2026-08-27 amendment reframes but keeps.
#
# ## The design problem is not the YAML
#
# **Eleven** node ids fail by design on any newer yt-dlp — twelve tests, one of them parametrised —
# and **every one of them was found by running this rather than by reading it.** The count has been
# wrong twice, in the same direction, for the same reason:
#
#   - It was written as **one**. A dry run of the logic found a second.
#   - It was **two** until `T291-R1` put `tests/integration` back into the suite, which is where the
#     other nine live. Run `33228602891` is where they appeared.
#
# They fall into two groups:
#
#   - **The version bookkeeping** — `test_the_audit_names_the_yt_dlp_version_it_was_taken_against`,
#     how a pin bump forces the audit to be re-taken (`T-183`, `NFR-008`), and
#     `test_the_installed_baseline_is_the_pinned_one`, which asserts exactly the thing this job
#     deliberately breaks.
#   - **The freeze probe and the update service** — nine cases in `tests/integration` that each
#     require the installed yt-dlp to *be* the pinned baseline. Four of them are not version tests
#     at all; the probe reports the version mismatch first, so they cannot reach their subject here.
#     `EXPECTED_STALE` says which, and why, beside the list itself.
#
# A canary that ran them would be red on every single run, forever, and muted within a month. So
# they are **deselected and reported separately**, and the job's verdict is what remains:
#
#   - *the audit's version line is stale*, and *the installed yt-dlp is not the pinned one* —
#     both expected, both informational, neither a finding
#   - *an option exists that nothing classifies* — a real finding, and its own failure message
#     already names the new options
#   - *a container appeared or vanished* — a real finding
#   - *anything else* — the interesting case, because behaviour moved rather than a list
#
# ## What this job may not do
#
# **It never writes to the repository.** No pin bump, no commit, no regenerated audit. Bumping the
# baseline is a decision with a release gate attached (`OPS-002`), and re-taking the audit is
# `T-183`'s procedure and a human's judgement about what each new option means. This reports.
#
# **It never blocks a push.** It has no `push:` trigger and `main` does not gate on it. It *does*
# block a baseline bump — `docs/project/TESTING.md` §8 carries that step — because a bump is exactly the
# moment its answer is the evidence being asked for.

name: yt-dlp canary

on:
  # **Weekly, not nightly.** yt-dlp ships roughly monthly; a job whose whole purpose is to notice
  # change should not run thirty times per change. Monday 07:00 UTC — nothing depends on the hour,
  # and it is deliberately not `ci.yml`'s 06:00 so the two do not contend for the one Linux box.
  schedule:
    - cron: "0 7 * * 1"
  # So a bump can ask for the answer on the day rather than waiting for Monday.
  workflow_dispatch:
  # **No `push:` and no `pull_request:`.** The first would make this a gate, which it is not; the
  # second is `prose.yml`'s security control, and the reasoning there applies unchanged — every
  # job here resolves to a self-hosted runner while `LINUX_RUNNER` is set.

# Its own group, so a canary run neither cancels nor is cancelled by `CI` or `Prose`.
concurrency:
  group: ytdlp-canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# **`shell: bash`, and it is load-bearing rather than tidiness.** GitHub's *default* shell is
# `bash -e {0}`; naming `bash` explicitly gets `bash --noprofile --norc -eo pipefail {0}`. Without
# `pipefail` a pipeline exits with its **last** command's status, so
# `pytest … | tee reports/canary.txt` exited 0 whatever pytest said — and this job's verdict step
# could not fail. **Measured on run `33228602891`**, the first real execution: `11 failed, 3799
# passed` in `canary.txt`, step reported `success`, job reported `success`. Every `if:` condition
# `T291-R2` added was reading an outcome that could only ever be `success`.
#
# `ci.yml` has carried this exact block since it was written and says so at its `Tests` step; this
# file was authored without it.
defaults:
  run:
    shell: bash

env:
  # **One definition of the expected-failure set**, so the step that reports it and the step that
  # excludes it cannot disagree — which is how a canary silently starts hiding a real failure.
  #
  # **It is one definition now; it was two** (`T291-R3`). A second variable held the same two node
  # ids spelled as `--deselect` arguments, and the comment above claimed the single source the
  # file did not have. Editing one and not the other recreates exactly what this structure exists
  # to prevent: a node id in the reported set but not the excluded one is red on every run
  # forever, and one in the excluded set but not the reported one vanishes from the job's account
  # of itself. The verdict step builds its own arguments from this list, so there is nothing left
  # to keep in step.
  #
  # **It was two node ids and it is eleven** (`T291-R1`'s consequence, measured on run
  # `33228602891`). The pair was derived from a unit/UI-only run; putting `tests/integration` back
  # in — which is what that finding required — added **nine** more tests that assert the installed
  # yt-dlp *is* the pinned baseline, the one thing this job exists to violate. They are not drift:
  # every one passes against the pin, and each failure message is the freeze probe or the service
  # correctly reporting `2026.08.19` where `2026.7.4` was pinned.
  #
  # **Four of the `test_freeze_probe.py` entries are not version tests at all** — they are named
  # for a missing extractor module, a lazy table, a lazy placeholder and an extractor that does not
  # match its own URLs. The probe checks the version *first* and returns that message, so in this
  # environment those four cannot reach their subject whether they are deselected or not.
  # Deselecting them loses nothing that was being tested here, and this note is so a reader does
  # not later mistake it for coverage this job silently dropped.
  #
  # **`test_the_gate_checks_the_bundled_version_against_the_pin` is named without its parameter,
  # deliberately.** Its ids interpolate the pin — `[2026.7.4-0]` and `[2019.1.1-1]` — so a node id
  # carrying one would stop matching the day the pin moves, silently, and pytest ignores a
  # `--deselect` that matches nothing. The prefix takes both parametrisations, which costs the
  # `[2019.1.1-1]` case that would have passed. A stable list is worth one case in a weekly job.
  #
  # **What this list cannot do is notice a *new* pin-dependent test.** One added later is not here,
  # so it fails and the canary goes red — visible, and someone has to act on it. A pytest marker on
  # the tests themselves would carry the property where it belongs and could not drift at all; that
  # is the better structure and it is put to the maintainer rather than taken here, because it
  # spans `pyproject.toml` and three test files, and because a command-line `-m` **replaces**
  # `addopts`' own marker expression rather than adding to it, so the job would have to restate
  # `not network and not windows_desktop` and could drift from *that* instead.
  EXPECTED_STALE: >-
    tests/unit/test_option_audit.py::test_the_audit_names_the_yt_dlp_version_it_was_taken_against
    tests/unit/test_environment.py::test_the_installed_baseline_is_the_pinned_one
    tests/integration/test_freeze_probe.py::test_a_missing_extractor_module_fails_the_gate
    tests/integration/test_freeze_probe.py::test_an_extractor_that_claims_every_url_fails_the_gate
    tests/integration/test_freeze_probe.py::test_an_extractor_that_does_not_match_its_own_urls_fails_the_gate
    tests/integration/test_freeze_probe.py::test_an_extractor_that_stays_lazy_fails_the_gate
    tests/integration/test_freeze_probe.py::test_the_gate_checks_the_bundled_version_against_the_pin
    tests/integration/test_freeze_probe.py::test_the_probe_passes_against_a_correctly_installed_ytdlp
    tests/integration/test_ytdlp_service.py::test_a_broken_installed_copy_falls_back_and_the_rejection_is_reported
    tests/integration/test_ytdlp_service.py::test_installing_then_reverting_moves_the_reported_version_and_moves_it_back
    tests/integration/test_ytdlp_service.py::test_the_reported_version_is_the_baseline_a_child_actually_imports

jobs:
  canary:
    name: latest yt-dlp
    # `OPS-012`: Linux runs on the maintainer's Fedora machine. Unset means hosted.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    # **45, raised from 30 when `T291-R1` put `tests/integration` back in.** The 30 was set against
    # a unit/UI-only, `-n auto`-shaped run; this one is the whole default suite, serial, after a
    # fresh virtualenv and a full `[dev]` install. Sized as headroom rather than as a measurement,
    # for `T118-R10`'s reason: a bound with none flaps on how busy the machine is rather than on
    # the code, and a canary that fails at a cliff nobody was watching is a canary nobody reads.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Hosted only, matching `ci.yml` and `prose.yml`: a job must never provision its own host.
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14"

      - name: Check the machine's Python
        if: runner.environment != 'github-hosted'
        run: python3 --version

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # **The same step `ci.yml` carries, and its absence here is what `OPS-012`'s move cost.**
        # This workflow was written while Linux always ran on Fedora, where these are present, so
        # nothing needed installing. On 2026-09-08 Linux moved to `ubuntu-latest` and the first
        # rerun died on `libEGL.so.1: cannot open shared object file` — inside pytest, as an
        # `INTERNALERROR`, which reads like the suite rather than the image.
        #
        # Installed on hosted runners and verified on self-hosted ones, for `ci.yml`'s reasons:
        # `apt-get` does not exist on Fedora, and a job must not install packages on a machine
        # somebody uses.
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          else
            echo "self-hosted: not installing system packages; verifying what is present"
            missing=""
            for lib in libEGL.so.1 libGL.so.1 libxkbcommon.so.0 libdbus-1.so.3 libfontconfig.so.1; do
              if ldconfig -p | grep -q "$lib"; then
                echo "  $lib: present"
              else
                echo "  $lib: MISSING"
                missing="$missing $lib"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::error::Missing Qt runtime libraries:$missing"
              echo "::error::On Fedora: sudo dnf install -y mesa-libEGL mesa-libGL libxkbcommon dbus-libs fontconfig"
              exit 1
            fi
          fi

      - name: Install the project, then the yt-dlp we have not pinned
        run: |
          python3 -m venv .venv-canary
          .venv-canary/bin/python -m pip install --upgrade pip
          .venv-canary/bin/python -m pip install -e ".[dev]"
          # **After the project, so it overrides the pin.** Installing it first would be undone
          # by the project's own `yt-dlp==` constraint.
          .venv-canary/bin/python -m pip install --upgrade yt-dlp
          # **On `PATH`, not merely installed.** `tests/unit/test_toolchain_versions.py` resolves
          # `ruff` and `mypy` with `shutil.which` — deliberately, because `T269-R1` found a gate
          # approving a different binary from the one it gates with. Calling the interpreter by
          # path leaves the virtualenv off `PATH`, so both cases failed on run `33228602891` with
          # *"no `ruff` on PATH"*. That is this job's environment, not yt-dlp drift, and it is
          # indistinguishable from drift in the report — which is the whole thing `T291-R2` is
          # about. `ci.yml` adds its venv to `GITHUB_PATH` for the same reason.
          echo "$PWD/.venv-canary/bin" >> "$GITHUB_PATH"

      - name: Record which versions actually ran
        run: |
          mkdir -p reports
          {
            echo "pinned:    $(grep -oE 'yt-dlp==[0-9.]+' pyproject.toml)"
            echo "installed: $(.venv-canary/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.__version__)')"
          } | tee reports/versions.txt
          # A report that does not say which version it ran evidences nothing later.
          { echo '### Versions'; echo '```'; cat reports/versions.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      # **Informational: this step reports and never decides the job.** These tests fail on any
      # newer yt-dlp by design, and the `if` below is what keeps their result off the verdict — an
      # earlier version of this comment claimed a `|| true` that was never in the code, which is a
      # comment describing an implementation the file does not have.
      - name: The tests this job breaks on purpose
        run: |
          if .venv-canary/bin/python -m pytest ${{ env.EXPECTED_STALE }} \
              -q > reports/expected-stale.txt 2>&1; then
            echo '### Version bookkeeping: **current** — this yt-dlp *is* the pinned baseline,' \
              'so the canary found nothing newer to test against' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Version bookkeeping: **stale** — expected, and not a finding on its own' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything else. **This step is the verdict**, and `id` is what makes that structural
      # rather than a claim in a comment — the step below reads this outcome by name.
      #
      # **The configured default suite, invoked as `pytest` with no paths at all** (`T291-R1`).
      # This read `tests/unit tests/ui`, which is two thirds of it: `testpaths = ["tests"]` in
      # `pyproject.toml` includes `tests/integration`, and integration is not irrelevant to the
      # question this job asks. `test_worker.py` imports the resolved yt-dlp version and its
      # ffmpeg tables, and `test_post_processing.py` drives the real `YoutubeDL` and its
      # postprocessor registry — so a newer yt-dlp could break the paths this product actually
      # downloads through while the canary stayed green. Naming no path also means the list
      # cannot drift from the configuration again.
      #
      # **Serial, and deliberately.** `ci.yml` splits the suite in two so the unit and UI slice can
      # take `-n auto`; that split is exactly the second path list this correction removes, and
      # `T-123` is why `tests/integration` may not be parallelised at all. A weekly job trades a
      # few minutes for having no path list to keep in step.
      #
      # **The deselection is built from `EXPECTED_STALE`**, so `T291-R3`'s two lists are one.
      - name: The suite, against the yt-dlp nobody has pinned
        id: verdict
        run: |
          deselect=()
          for node in ${{ env.EXPECTED_STALE }}; do deselect+=(--deselect "$node"); done
          echo "deselecting ${#deselect[@]} arguments: ${deselect[*]}"
          .venv-canary/bin/python -m pytest "${deselect[@]}" \
            -q --junitxml=reports/junit-canary.xml 2>&1 | tee reports/canary.txt

      # **Conditioned on the verdict step, not on `failure()`** (`T291-R2`). Bare `if: failure()`
      # is true when *any* previous step failed — GitHub documents it that way — so a checkout, a
      # `setup-python`, a `pip` that could not reach the index, or a machine without a working
      # `python3` all produced this same "upstream drift, file it as a task" diagnosis for a run
      # in which the suite never executed. A canary that misattributes its own infrastructure is
      # worse than one that is merely quiet: it manufactures findings against yt-dlp.
      - name: Say what a failure means
        if: failure() && steps.verdict.outcome == 'failure'
        run: |
          {
            echo '### This is a finding, not the expected staleness'
            echo
            echo 'The version-line test was deselected above, so what failed here is upstream'
            echo 'drift in behaviour or in a list. **File it as a task** — the option audit names'
            echo 'the new options in its own failure message, which is most of an entry written'
            echo 'for whoever files it. Do not bump the pin from this run: that is a decision with'
            echo 'a release gate attached (`OPS-002`, `docs/project/TESTING.md` §8).'
          } >> "$GITHUB_STEP_SUMMARY"

      # The other half of `T291-R2`: the run still has to say something when it breaks before it
      # can measure anything. `outcome` is the empty string for a step that never started, so this
      # covers both a setup failure and a verdict step that was skipped or cancelled.
      - name: Say that this run measured nothing
        if: failure() && steps.verdict.outcome != 'failure'
        run: |
          {
            echo '### No verdict — this run failed before it could test anything'
            echo
            echo 'The suite step did not fail; it reports'
            echo "\`${{ steps.verdict.outcome || 'never started' }}\`. So this is checkout,"
            echo 'Python, the virtualenv, the package index or the runner itself, **not** yt-dlp.'
            echo 'Do not file it against upstream and do not read the absence of a finding as'
            echo 'evidence that the newest yt-dlp is fine — this run never saw it. Re-dispatch'
            echo 'once the machine is well.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-ytdlp-canary
          path: reports/
          retention-days: 90
