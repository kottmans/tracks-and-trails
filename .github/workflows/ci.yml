# CI — T-006.
#
# This is deliberately larger than a lint-and-test pipeline. Per OPS-003 the maintainer has no
# Windows machine, so the Windows runner here is the ONLY Windows environment this project
# has. Anything it does not check is genuinely unverified on Windows, not merely unautomated.
# Two consequences shape the file:
#
#   - fail-fast is off. A Linux failure must never cancel the Windows job; Windows evidence is
#     the scarce resource.
#   - every job uploads its evidence, pass or fail.
#
# Windows failures are debugged from two distinct sources, and neither replaces the other:
#
#   - the Actions job log, owned by GitHub, covers EVERY step including checkout, setup-python,
#     the apt install and pip install. Those run before reports/ exists, so a failure there
#     produces little or no artifact and the log is the only record of it.
#   - the uploaded reports/ artifact covers this project's own gates — lint, format, mypy, the
#     Qt baseline and pytest — plus an environment snapshot and the junit XML. It is the part
#     that can be downloaded and analyzed offline rather than read in a browser.
#
# See docs/project/TESTING.md §10 and the T-006 entry in docs/project/COMPLETED_TASKS.md.

name: CI

on:
  push:
    paths-ignore: &prose
      # **Prose that no test reads** (`OPS-011`, widening `OPS-009`). Every push here used to run
      # the full matrix, including two Windows jobs at 2x, for files nothing asserts on. It also
      # meant a documentation push cancelled whatever run was in flight.
      #
      # **The narrow version of this list did not work**, and the failure is measured: on
      # 2026-08-05 four consecutive pushes produced three cancellations and no Windows evidence,
      # because Windows needs ~19 uninterrupted minutes on the one `STARBASE` slot while prose
      # commits were landing every ~2 minutes. Not one of the cancelled runs carried a source
      # change — `a884035`'s tree was byte-identical to `main` across `src/`, `tests/`,
      # `packaging/`, `tools/` and `.github/` throughout. The gate was rebuilding the same code
      # and being killed by commits that only added text.
      #
      # **`docs/project/TASKS.md` is in this list, and its gate did not go with it.**
      # `tests/unit/test_task_placement.py` reads that file. `OPS-009` originally kept it
      # out of this list, which is why the two pushes that cancelled runs on 2026-08-05 (`T-144`
      # and `T-145`, both `docs/project/TASKS.md` alone) still ran the full matrix.
      #
      # Exempting it here would have been the silent-coverage-loss `P2EXIT-R4` found once already.
      # Instead the gate **moved to `.github/workflows/prose.yml`**, which runs that one test and
      # nothing else: no Qt, no package install, no Windows, seconds rather than 19 minutes. The
      # coverage is unchanged; only its cost is.
      #
      # TASKS and COMPLETED_TASKS now both feed placement and other task-reading checks.
      # COMPLETED_TASKS stays outside this list so closure updates run those other checks too.
      # Adding a file here is a coverage decision, not tidying: inspect its test consumers first.
      - "docs/project/ARCHITECTURE.md"
      - "docs/project/DECISIONS.md"
      - "docs/project/IMPLEMENTATION_PLAN.md"
      - "docs/project/PROMPTS.md"
      - "docs/project/REQUIREMENTS.md"
      - "docs/project/REVIEWS.md"
      # Moved review prose keeps the same CI treatment as the former single file.
      - "docs/project/reviews/*.md"
      - "docs/project/STATUS.md"
      - "docs/project/TASKS.md"
      - "docs/project/TESTING.md"
      - "docs/project/*.html"
      - "docs/project/evidence/**"
      - "docs/project/handoffs/**"
      # **`docs/` is enumerated rather than globbed, and `docs/YTDLP_OPTION_AUDIT.md` is the
      # reason** (`T-183`). This was `docs/**` when nothing under `docs/` was read by a test. The
      # audit is: `tests/unit/test_option_audit.py` opens it and checks it against the option keys
      # `build_options` really sets, so an edit to that file alone is a change to a gated claim.
      # Under the glob it would have skipped every job — the silent coverage loss `P2EXIT-R4`
      # found, arriving as a side effect of where a file was put.
      #
      # A new file under `docs/` is therefore **not** ignored until somebody adds it here, having
      # checked that no test reads it. Fail-closed is the right direction for this list: the cost
      # of a needless run is minutes, and the cost of a missed one is a gate nobody notices is gone.
      - "docs/CRITERION_8_CHECKLIST.md"
      - "docs/DEVELOPMENT.md"
      - "docs/PHASE_4_CHECKLIST.md"
      - "docs/UX_SPEC.md"
      - "docs/WINDOWS_VERIFICATION.md"
      - "docs/mockups/**"
      - "AGENTS.md"
      - "README.md"
      - "LICENSE"
      - "**/*.md.orig"
  # **No `pull_request:` trigger, and its absence is a security control** (`T-262`).
  # Every job in this repository resolves to a **self-hosted runner** while `LINUX_RUNNER`,
  # `WINDOWS_RUNNER` and `STARBASE_AVAILABLE` are set, and GitHub runs fork pull requests with
  # the fork's own code. In a public repository that is arbitrary code execution on the
  # maintainer's Fedora machine and on `STARBASE`, gated only by a fork-approval setting that
  # auto-approves anyone with one merged pull request.
  #
  # Nothing is given up: `AGENTS.md` §7 makes this a one-checkout, one-writer project that
  # commits straight to `main`, and a branch requires explicit instruction. **Restoring this
  # trigger requires gating every self-hosted job** on
  # `github.event.pull_request.head.repo.full_name == github.repository`, not just adding the
  # line back.
  # **Windows on demand, and once a night.** See the `windows desktop` job: the full Windows
  # suite stopped running on every push because it was costing ~13 minutes of a ~32 minute run
  # and slowing development to the point where the gate was the bottleneck rather than the work.
  workflow_dispatch:
  schedule:
    # 06:00 UTC. Nothing depends on the hour. Since `OPS-010` every push runs the full matrix,
    # so this is no longer standing in for missing coverage — it catches what *no* commit causes:
    # a re-resolved dependency, a runner OS update, the desktop machine drifting. It also means a
    # quiet week still produces evidence.
    - cron: "0 6 * * *"

# A superseded push run has no value; cancel it. **A scheduled run is not superseded by a push**
# (`P2EXIT-R4`): it answers a different question — whether the environment drifted, not whether a
# commit is sound — and a global `cancel-in-progress` let any push destroy that answer. The
# guarantee read as true until somebody checked. Scheduled runs get their own group *and* are not
# cancelled.
concurrency:
  # The **separate group** is the load-bearing half: `cancel-in-progress` is read from the *arriving*
  # run, so a push arriving into a shared group would cancel a running nightly no matter what the
  # nightly asked for. The `false` below then stops two scheduled runs from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ondemand' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

defaults:
  run:
    # bash on both runners, so every step below is written once rather than per-platform.
    shell: bash

jobs:
  check:
    # **The Linux leg is called `linux`, not after a distribution** (`OPS-012`). It was
    # `ubuntu-latest`, which stopped being true the moment `LINUX_RUNNER` pointed it at Fedora — a
    # green board naming a platform nothing ran on is the class of claim this project keeps
    # finding. `fedora-latest` would be wrong in the other direction, because unsetting the
    # variable restores the hosted Ubuntu image and that is what a fork gets. The name states the
    # *cell being covered*; which machine took it is recorded per-run by the runner name.
    name: ${{ matrix.os == 'windows-latest' && 'windows-latest' || 'linux' }}
    # `WINDOWS_RUNNER` selects where the Windows leg runs without editing this file (`OPS-009`).
    # Unset means `windows-latest`, which is the ruling's default: hosted, for clean-machine
    # evidence. If the hosted allowance runs out, set it to `["self-hosted","windows","desktop"]`
    # and every Windows job is on `STARBASE` with no push required.
    #
    # **`LINUX_RUNNER` does the same for Linux** (`OPS-012`). Unset means `ubuntu-latest`, so the
    # default behaviour of this file is unchanged and a fresh clone still runs hosted. Set it to
    # `["self-hosted","Linux","fedora"]` and Linux runs on the maintainer's machines, which are
    # **faster than the hosted image, not merely cheaper**: the full suite is 4m29s on the desktop
    # against 7m36s for this whole job hosted, measured 2026-08-05.
    runs-on: >-
      ${{ matrix.os == 'windows-latest'
          && fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"')
          || fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    # **25, raised from 15 on 2026-08-11** (`T-123`). The 15 was set when the suite was 2653 tests
    # and 4m29s on this machine; at 3130 it ran out mid-`Tests` in run `31553176677` and cancelled
    # a job whose every other gate was green. Parallelising the unit and UI half is the actual fix
    # and it is in the `Tests` step below — this is the headroom, so that the *next* time the
    # suite outgrows the bound the board says "slow" by failing late rather than by failing at a
    # cliff nobody was watching. A bound with no headroom flaps on runner speed rather than on the
    # code, which is `T118-R10`.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # **The Windows leg is dropped when `WINDOWS_RUNNER` points it at `STARBASE`**, because
        # `windows desktop` already runs the identical suite on that machine — 1972 passed, 21
        # skipped, 32 deselected in both jobs of run `30861672178`, within four seconds of each
        # other, back to back on one runner slot.
        #
        # What this leg contributed was **clean-machine** evidence on a fresh hosted image, which
        # is exactly what it stops being when it is routed to the desktop. What is given up is the
        # offscreen platform plugin *on Windows*: the real plugin on Windows and offscreen on Linux
        # both remain, and they bracket it. Unset the variable and this leg — and its meaning —
        # come back with no other change.
        os: >-
          ${{ vars.WINDOWS_RUNNER
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest","windows-latest"]') }}

    env:
      # docs/project/TESTING.md §2: the UI suite runs headless. tests/ui/conftest.py sets the same value
      # via setdefault for local runs; setting it here makes CI's behavior explicit rather
      # than inherited.
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v7

      # **Hosted runners only**, exactly as the `frozen` job already guards it. On a machine
      # somebody uses, `setup-python` runs the real installer: it deleted the tool-cache
      # interpreter and then failed the reinstall (run `30823595744`). `OPS-009` fixed that for
      # `frozen` and left this behind — which was harmless only while `WINDOWS_RUNNER` was unset,
      # and became the blocker the moment the Windows leg was pointed at `STARBASE`.
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          # ARC-001 / T-002: the pinned baseline. PySide6 ships abi3 wheels, so this is a
          # project choice, not a PySide6 constraint.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the machine's Python
        # A self-hosted runner must not provision itself as a side effect of running a build, so
        # it uses the Python already installed and says so if that is the wrong one.
        if: runner.environment != 'github-hosted'
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # The offscreen platform plugin still links EGL/GL and xkbcommon; without these the
        # Qt import succeeds and QApplication construction fails, which is a confusing way to
        # discover a missing system package.
        #
        # **Installed on hosted runners, verified on self-hosted ones** (`OPS-012`), the same
        # position the ffmpeg step below already takes. Two reasons, and the second is the real
        # one: `apt-get` does not exist on Fedora, and a job must not install system packages on
        # a machine somebody uses — that is the `setup-python` incident at run `30823595744`.
        #
        # Verified rather than merely skipped: a missing library here surfaces as a puzzling
        # `QApplication` failure hundreds of lines later, so this fails immediately and says which
        # library and how to install it. Silence would be the weakening; this is not silent.
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          else
            echo "self-hosted: not installing system packages; verifying what is present"
            missing=""
            for lib in libEGL.so.1 libGL.so.1 libxkbcommon.so.0 libdbus-1.so.3 libfontconfig.so.1; do
              if ldconfig -p | grep -q "$lib"; then
                echo "  $lib: present"
              else
                echo "  $lib: MISSING"
                missing="$missing $lib"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::error::Missing Qt runtime libraries:$missing"
              echo "::error::On Fedora: sudo dnf install -y mesa-libEGL mesa-libGL libxkbcommon dbus-libs fontconfig"
              exit 1
            fi
          fi

      - name: Install ffmpeg
        # T-062. This project is a front end for a tool that shells out to ffmpeg, so a runner
        # without it is not a neutral environment — it is one where REQ-024's gate refuses
        # before downloading and the end-to-end tests cannot reach their subject at all. Both
        # T-037 tests failed on both platforms for exactly that reason and had never passed on
        # either; they passed locally, which is how they reached approval.
        #
        # Installed rather than worked around: the alternative is tests that assert a download
        # in an environment no user has. That a *user* without ffmpeg is refused more than they
        # should be is a separate defect (T-061) with its own gate, and installing ffmpeg here
        # does not paper over it.
        #
        # **Installed on hosted runners, recorded on self-hosted ones.** `choco install ffmpeg` on
        # `STARBASE` would put software on a machine somebody uses, for the same reason
        # `setup-python` must not. The `windows desktop` job already takes that position and runs
        # this same default suite there without ffmpeg — so recording is not a weakening, it is
        # the configuration that job has been proving all along.
        run: |
          if [ "${{ runner.environment }}" != "github-hosted" ]; then
            echo "self-hosted: not installing ffmpeg; recording what is present"
            command -v ffmpeg || echo "ffmpeg: NOT FOUND — this run measured the no-ffmpeg configuration"
            ffmpeg -version 2>&1 | head -1 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            choco install ffmpeg --no-progress -y
          fi

      # T-066: the suite runs in a virtualenv, because `docs/DEVELOPMENT.md` tells developers
      # to use one and a gate that measures a different environment is measuring the wrong
      # thing. On Windows this is not cosmetic: `python -m venv` installs a *launcher* as
      # `Scripts/python.exe` which spawns the real interpreter as a child, so every
      # `multiprocessing` spawn sits one generation deeper than it does without a venv. That is
      # the tree shape `T-019`'s descendant reaping is about, and until now no job produced it.
      #
      # Testing the deeper tree is the superset: reaping that works with the extra level works
      # without it.
      #
      # Adding the venv to GITHUB_PATH rather than calling it by path in every step keeps the
      # commands below identical to the ones `docs/project/TESTING.md` §4 publishes.
      - name: Create the virtualenv
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            # `shell: bash` on a Windows runner is Git Bash, where $PWD is an MSYS path
            # (/d/a/repo/repo). GITHUB_PATH is consumed by the runner itself and needs a
            # native path, so this converts rather than echoing what bash would print.
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record the environment
        # Written to the artifact so a Windows failure can be diagnosed without a Windows
        # machine — which, per OPS-003, is the only way it will ever be diagnosed.
        run: |
          mkdir -p reports
          {
            echo "runner:  ${{ runner.os }} / ${{ matrix.os }}"
            echo "ref:     ${{ github.ref }} @ ${{ github.sha }}"
            python -VV
            echo "--- ffmpeg ---"
            # T-062: its absence was invisible in this artifact and had to be inferred from a
            # failure three files away. `|| true` because a missing ffmpeg is a fact to record,
            # not a reason to fail the step that records it.
            command -v ffmpeg || echo "ffmpeg: NOT FOUND"
            ffmpeg -version 2>&1 | head -1 || true
            # `T-269`: the two versions that decide whether a change may land, on their own
            # lines. `pip list` already contains them, buried among sixty others — and comparing
            # two runs' formatter versions was the thing nobody could do quickly when `T-266`'s
            # round was lost to a 0.16.0/0.16.3 split. Neither number is written here; both are
            # whatever `pyproject.toml`'s exact pins installed, and
            # `tests/unit/test_toolchain_versions.py` fails if they are not.
            echo "--- gates ---"
            ruff --version
            mypy --version
            echo "--- installed ---"
            python -m pip list
          } | tee "reports/environment.txt"

      # Every check below tees into reports/ as well as the job log. Both destinations matter:
      # the log is the complete record and the only one covering the setup steps above, while
      # the artifact is the downloadable unit that can be grepped and diffed offline. A gate
      # whose diagnostic reaches only the log cannot be analyzed without the Actions UI, which
      # under OPS-003 is a real cost — these are the project's own checks, so unlike the setup
      # steps their output is ours to capture. `shell: bash` runs with pipefail, so teeing does
      # not mask the non-zero exit that fails the step.
      - name: Lint
        run: ruff check . 2>&1 | tee "reports/lint.txt"

      - name: Format check
        run: ruff format --check . 2>&1 | tee "reports/format.txt"

      - name: Types
        run: mypy src 2>&1 | tee "reports/mypy.txt"

      - name: Types, tests included
        # `pyproject.toml` declares `files = ["src", "tests"]`, so plain `mypy` — what a developer
        # actually types — covers the test tree. CI checked only `src`, so the two disagreed and
        # the fuller gate went red for a whole session without anything noticing: fakes fell behind
        # a protocol they implement, and a property narrowed across asserts made whole tests
        # unreachable. A gate nobody runs is not a gate.
        run: mypy 2>&1 | tee "reports/mypy-all.txt"

      - name: Qt baseline
        # Discharges the Windows half of T-002, which was verified on Linux only: PySide6
        # installs, imports, and constructs a QApplication + QWidget offscreen.
        run: python .github/scripts/qt_baseline.py 2>&1 | tee "reports/qt-baseline.txt"

      - name: Tests
        # Network tests stay excluded by the addopts in pyproject.toml (docs/project/TESTING.md §10).
        #
        # The `process_tree` tests are back in this run as of `T-019`. They had their own step
        # for one day, because `T019-R1` found the marker excluding them from CI as well as
        # locally; the marker is gone now, so a separate step would run them twice.
        #
        # **This job carries T-108's merge proof, so a missing ffmpeg fails rather than skips**
        # (`T-189`). The step above installs the tool on both hosted runners, so the variable
        # should never fire here — which is the point: if the install ever silently stops working,
        # the required end-to-end case goes red instead of turning into a green SKIPPED line.
        #
        # **Two invocations, because only one half of the suite parallelises safely** (`T-123`).
        # This step is what run `31553176677` was cancelled inside, at the 15-minute cap, with
        # every gate before it green: the suite had grown past the bound — 3130 tests against the
        # 2653 behind the 4m29s measured on this machine on 2026-08-05.
        #
        #   - **`tests/unit` and `tests/ui` take `-n auto`**: 2711 of the 3130 tests, **23 s
        #     against 186 s**, five consecutive green runs.
        #
        #     **Not because they start no processes** — that claim was wrong twice (`T123-R2`),
        #     first by denying the processes and then by asserting an isolation the slice did not
        #     have. What holds is two properties, both now enforced rather than argued:
        #
        #       * **nothing shared is written** — every per-user directory is redirected into the
        #         test's own `tmp_path` by the autouse fixture in `tests/conftest.py`, the one
        #         `docs/project/TESTING.md` §5 always required and nobody had built. The same run left
        #         **241 job logs in the real user cache** before it existed and **0** after;
        #       * **nothing reaps what it did not start** — `psutil.process_iter` appears nowhere
        #         under `tests/unit` or `tests/ui`, which is the property parallelism breaks and
        #         the one `tests/integration/test_manager.py` violated.
        #   - **`tests/integration` stays serial.** It is where every hazard `T-123` names lives,
        #     and two of them are real. One was found and fixed here: the stray-reaper in
        #     `test_manager.py` scans *every process on the machine* and killed other xdist
        #     workers' live processes, which is `test_the_survival_check_can_tell_a_live_process_
        #     from_a_dead_one` failing one run in six. The other is open: under parallel load a
        #     retry deadline stops firing and
        #     `test_a_stopped_queue_parks_an_automatic_retry_until_it_is_started` fails — a timed
        #     gate with no headroom, which is `T118-R10`'s defect class and is filed rather than
        #     absorbed here.
        #
        # `-n 4` runs integration in **83 s against 297 s**, green three times of three. That is
        # not adopted: `T-123` says in terms that a lower worker count carries the same hazard at
        # a lower rate, and "a gate that fails rarely is one people re-run". It is the maintainer's
        # call, not a tuning knob to reach for once the board is green.
        #
        # **Linux only.** The evidence is Linux, and `T-056` is an open *Windows* defect about
        # whether a process is alive — the question parallel load perturbs. The Windows legs stay
        # serial until someone can watch a parallel run there.
        #
        # **The selector is a shell test, not a `${{ }}` ternary, and that is `T123-R1`.** This
        # read `${{ matrix.os == 'windows-latest' && '' || '-n auto' }}`, which is the common
        # pseudo-ternary idiom and is **wrong whenever the true arm is falsey**: on Windows it
        # evaluates to `'' || '-n auto'`, and the empty string loses. Both legs parallelised, so
        # the workflow did the opposite of what the four comments above it promised, on the one
        # platform the evidence deliberately excludes. GitHub has no ternary; an expression whose
        # correctness depends on both arms being truthy is a trap, so the decision is made where
        # it can be read and run.
        #
        # `RUNNER_OS` rather than `matrix.os`: the runner's own answer, which stays right when
        # `LINUX_RUNNER` or `WINDOWS_RUNNER` points a matrix label at a different machine.
        env:
          TRACKSANDTRAILS_REQUIRE_FFMPEG: "1"
        run: |
          parallel=""
          if [ "$RUNNER_OS" != "Windows" ]; then parallel="-n auto"; fi
          echo "unit/UI slice: pytest -v ${parallel:-(serial)} on $RUNNER_OS"
          pytest -v $parallel tests/unit tests/ui \
            --junitxml="reports/pytest-unit-ui.xml" 2>&1 | tee "reports/pytest-unit-ui.txt"
          pytest -v tests/integration \
            --junitxml="reports/pytest-integration.xml" 2>&1 | tee "reports/pytest-integration.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.os == 'windows-latest' && 'windows-latest' || 'linux' }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  # T-026 / OPS-004. The `check` job above pins QT_QPA_PLATFORM=offscreen for the whole
  # workflow, which is right for a headless suite and is exactly why it can never satisfy the
  # Phase 0 exit criterion "the window launches ... on Windows". This job is the one place the
  # override is absent, so Qt loads the real `windows` platform plugin and the window reaches
  # an actual desktop.
  #
  # Windows only. The Linux runner has no display server, so the equivalent there would need
  # xvfb and would prove something different; Linux launch is verified by the maintainer's own
  # desktop, which Windows has never had (OPS-003).
  #
  # **Self-hosted as of 2026-07-28.** `STARBASE` is a Windows 10 machine on the maintainer's
  # network, and it runs this job because a GitHub-hosted runner cannot be relied on for it:
  # Actions usage ran out mid-Phase-1 and the one job that proves the window reaches a desktop
  # went with it. Self-hosted minutes are not billed, so this job survives that.
  #
  # **The runner is started from `run.cmd` in a logged-on session, never installed as a Windows
  # service.** A service runs in session 0, which has no window station: Qt does not fail there,
  # it degrades — the offscreen platform loses its font database and the real `windows` plugin
  # cannot set DPI awareness. Every focus assertion in this job would pass while proving
  # nothing, which is precisely the "retire a gate and replace it with theatre" failure `T-026`
  # exists to prevent. Verified: `Runner.Listener.exe` reports Session#2, RDP-Tcp#2.
  #
  # It also runs **elevated**, matching a GitHub-hosted runner, so the symlink tests `T-070`
  # made conditional still execute here rather than skipping.
  #
  # `docs/WINDOWS_VERIFICATION.md` carries the setup and both traps. If the machine is off or
  # logged out this job queues rather than failing, and `timeout-minutes` does NOT bound that:
  # it caps how long a job may *run* once a runner picks it up. An unmatched self-hosted job
  # stays queued for up to **24 hours** before GitHub discards it (RUNNER-R1). Availability of
  # this job is the availability of one desktop machine, with a day-long failure mode, not a
  # 15-minute one.
  # **Says out loud when the self-hosted work did not run** (`OPS-009`). A skipped job is silent,
  # and that silence has cost real coverage: `dd9c238` added two `shell: pwsh` steps and `T-084`
  # added a control to the progress view's focus chain, both while `STARBASE` was unreachable.
  # Both merged against green CI and both failed on the first run after the machine returned.
  # This job always runs, costs seconds on Linux, and puts the gap in the run rather than only in
  # `docs/project/DECISIONS.md`.
  starbase-coverage:
    name: STARBASE coverage
    # **On the maintainer's Linux machine, not a hosted image** (maintainer ruling, 2026-08-11:
    # *STARBASE and local machines exclusively*). This was the last job in the file on hosted
    # compute.
    #
    # **What the ruling costs, stated where the trade is made.** This job exists to announce that
    # self-hosted work did *not* happen, and a reporter that runs on a self-hosted machine is
    # silent in the case it was written for. That cost is smaller than it looks, and the reason is
    # that `STARBASE` is Windows and `LINUX_RUNNER` is a **different** machine: the case `OPS-009`
    # and `OPS-010` were actually written for — `STARBASE` unreachable while the work merges — is
    # still reported, because Fedora is up and running this job.
    #
    # **The residual is both machines down at once.** Then this job queues instead of reporting.
    # That failure is loud in a different way — the run sits pending with nothing green — where the
    # one `OPS-009` was written about was silent and green. Not equivalent, and not hidden.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    if: always()
    timeout-minutes: 5
    steps:
      - name: Report whether the self-hosted jobs ran
        # **Three outcomes, not two.** This said "the desktop slice and the frozen Windows job ran"
        # whenever the machine was available — which stopped being true the moment the desktop job
        # came off the push path. A summary that asserts a job ran when it was skipped is the
        # `COORD-R5` class in a place nobody re-reads, so it now reports which of the three
        # situations actually applies.
        shell: bash
        run: |
          if [ "${{ vars.STARBASE_AVAILABLE }}" != "true" ]; then
            echo "::warning::STARBASE_AVAILABLE is not set. The Windows desktop slice did NOT run,"
            echo "::warning::and neither did the frozen Windows job. Changes to either are merging"
            echo "::warning::unverified — see OPS-010. Set the variable when the machine is back."
          else
            echo "::notice::STARBASE is enabled; the desktop slice and the frozen Windows job ran."
            if [ -n "${{ vars.WINDOWS_RUNNER }}" ]; then
              echo "::notice::WINDOWS_RUNNER is set, so the hosted Windows leg of check did NOT run"
              echo "::notice::and offscreen-on-Windows is not covered (OPS-010, surrendered)."
            fi
          fi

          # **This job used to stay hosted deliberately** (`OPS-012`) — it was the only one that
          # did. The maintainer ruled on 2026-08-11 that STARBASE and local machines are used
          # exclusively, so it runs on `LINUX_RUNNER` now. See the comment on `runs-on` for what
          # that gives up and why the important half of the guarantee survives.
          if [ -n "${{ vars.LINUX_RUNNER }}" ]; then
            echo "::notice::LINUX_RUNNER is set, so Linux ran on the maintainer's machines, not on"
            echo "::notice::a hosted image. Ubuntu is not covered by this run and the frozen Linux"
            echo "::notice::artifact was built against Fedora's glibc (OPS-012, surrendered)."
          else
            echo "::notice::LINUX_RUNNER is unset; Linux ran hosted on ubuntu-latest."
          fi

  windows-desktop:
    name: windows desktop
    runs-on: [self-hosted, windows, desktop]
    # **Skipped unless STARBASE is actually online** (`OPS-005` amendment, 2026-08-01). A
    # self-hosted job whose runner is offline does not fail — it queues, and holds the whole run
    # in `queued` until something cancels it, so no run can ever reach a conclusion. That is worse
    # than not having the job: it turns every push into a run that never finishes.
    #
    # An unset variable evaluates false, so the safe default is *skip*. Set the repository variable
    # `STARBASE_AVAILABLE` to `true` when the machine is back and this job returns with it.
    # **On every push again** (`OPS-010`, after `P2EXIT-R4`). This briefly ran only nightly, on
    # demand, or on a `[win]` commit — removed for wall-clock, then justified with the hosted-minute
    # constraint, which does not apply to it: this job runs on `STARBASE` and costs nothing.
    # Quota justified *routing* Windows here; it never justified dropping the coverage. The
    # duplicate that genuinely cost money — the Windows leg of `check`, running the identical suite
    # on this same machine — is the thing that stays dropped.
    #
    # It runs in parallel with the hosted Linux gate, so Linux feedback still lands in ~7 minutes
    # and this arrives when it arrives. `OPS-010` states that Windows evidence is asynchronous:
    # required before review, not a barrier to carrying on working.
    #
    # `STARBASE_AVAILABLE` still gates it: an unset variable evaluates false, and a self-hosted
    # job whose runner is offline queues forever rather than failing (`OPS-005`).
    if: ${{ vars.STARBASE_AVAILABLE == 'true' }}
    # Raised from 15 with T-073: this job now carries the full suite as well as the desktop
    # slice, and 15 was sized for the slice alone. The number bounds how long the job may run
    # once started — it does not bound the queue wait, per RUNNER-R1 below.
    #
    # **Raised again, 30 to 40, on 2026-08-16 (`T-259`) — because the suite grew, not because it
    # hung.** Measured: the last healthy run took **25.8 min** against 30, which is four minutes of
    # headroom; the suite has since gained **154 tests** (3506 collected → 3660) and crossed it.
    # Two consecutive runs died at 30 min, the second on a freshly restarted runner with the
    # machine otherwise idle, which is what rules out contention.
    #
    # **40 rather than 45, and rather than 35.** The job now needs ~32 min, so 35 would restore the
    # same ~9% margin that just failed. It is not larger than 40 because `STARBASE` has **one**
    # slot: a genuinely hung job holds every Windows gate for the whole bound, so this number is
    # also the blast radius of a hang.
    timeout-minutes: 40

    env:
      # Deliberately NOT offscreen. Setting it to the real plugin rather than leaving it unset
      # makes the intent explicit and stops tests/ui/conftest.py's setdefault from quietly
      # reinstating offscreen — which would leave this job green while testing nothing.
      QT_QPA_PLATFORM: windows
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Stamp the job start time
        # `T092-R1`: the crash-dump report filters on this, so a dump from an earlier run or an
        # unrelated process cannot be attributed to this one.
        #
        # **`powershell`, not `pwsh`.** These two steps were written while `STARBASE` was offline
        # and assumed PowerShell 7; the machine has Windows PowerShell 5.1 and no `pwsh` on PATH,
        # so the first run after it came back died here — `pwsh: command not found` — and skipped
        # the entire desktop slice. Neither script uses anything 5.1 lacks, and 5.1 is on every
        # Windows by definition, which is the right dependency for a self-hosted runner nobody
        # wants to re-provision. The `-Encoding utf8` below is what GitHub documents for writing
        # `GITHUB_ENV` from 5.1.
        if: always()
        shell: powershell
        run: |
          "JOB_STARTED_AT=$([datetime]::UtcNow.ToString('o'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@v7

      # **No `actions/setup-python` here, and that is the point.**
      #
      # A GitHub-hosted runner is discarded after every job, so an action that installs software
      # costs nothing. This runner is a machine somebody uses, and the difference is not
      # academic: the first run of this job on `STARBASE` launched the real Python installer,
      # which found the existing 3.14.6, opened an interactive Modify/Repair dialog on the
      # desktop, and deadlocked against `msiexec` in session 0 for the full 15-minute timeout.
      # It left the machine's interpreter half-removed — `python.exe` gone from a directory that
      # still had `Lib` and `Scripts`. Recovering it took a forced reinstall.
      #
      # So this job uses the Python already on the machine. `docs/WINDOWS_VERIFICATION.md`
      # records the required version, and the check below fails loudly if it is not there —
      # which is the right failure, because a self-hosted runner should never be *provisioning*
      # itself as a side effect of running a test.
      - name: Check the machine's Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      # T-066: the suite runs in a virtualenv, because `docs/DEVELOPMENT.md` tells developers
      # to use one and a gate that measures a different environment is measuring the wrong
      # thing. On Windows this is not cosmetic: `python -m venv` installs a *launcher* as
      # `Scripts/python.exe` which spawns the real interpreter as a child, so every
      # `multiprocessing` spawn sits one generation deeper than it does without a venv. That is
      # the tree shape `T-019`'s descendant reaping is about, and until now no job produced it.
      #
      # Testing the deeper tree is the superset: reaping that works with the extra level works
      # without it.
      #
      # Adding the venv to GITHUB_PATH rather than calling it by path in every step keeps the
      # commands below identical to the ones `docs/project/TESTING.md` §4 publishes.
      # **The virtualenv persists between runs on this machine**, because building it is 111 s of
      # the 13 minutes and this runner's disk survives — measured in run `30861672178`.
      #
      # It lives outside the workspace deliberately: `actions/checkout` cleans untracked and
      # ignored files, so a `.venv` in the workspace is deleted and rebuilt every single run. The
      # directory is keyed by a hash of `pyproject.toml`, so a dependency change builds a fresh
      # one rather than reusing a stale set, and the install stays `-e` so source changes need no
      # reinstall at all.
      #
      # **Safe only while this machine runs one job at a time.** It does — a second runner slot
      # would need a lock here, and that is the first thing to check if one is ever added.
      - name: Reuse the persistent virtualenv
        run: |
          # **Twelve characters of the hash, not sixty-four.** The full digest pushed
          # `…\site-packages\PySide6\qml\Qt\labs\assetdownloader\…\qrc_…_init.cpp.obj`
          # past Windows' 260-character `MAX_PATH` and pip failed with `[Errno 2] No such file or
          # directory`. This project already knows that limit — `core/paths.py` budgets against it
          # — and the CI config walked into it anyway. Twelve hex characters is 2^48 of collision
          # space for a cache key whose worst case is one unnecessary rebuild.
          want=$(sha256sum pyproject.toml | cut -c1-12)
          venv="$RUNNER_TOOL_CACHE/tt-venv-$want"
          if [ ! -x "$venv/Scripts/python.exe" ] && [ ! -x "$venv/bin/python" ]; then
            echo "no venv for pyproject $want — building one"
            rm -rf "$RUNNER_TOOL_CACHE"/tt-venv-*
            python -m venv "$venv"
          else
            echo "reusing the venv for pyproject $want"
          fi
          if [ -d "$venv/Scripts" ]; then
            cygpath -w "$venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the project
        # `-e` against this workspace, whose path is stable on a self-hosted runner, so a reused
        # venv still points at the checkout. pip is a no-op when nothing changed, which is the
        # whole saving.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record the desktop
        # The OPS-004 spike's own output, captured on every run rather than once: if a future
        # runner image removes the desktop, this is where it becomes visible instead of the
        # suite failing obscurely.
        run: |
          mkdir -p reports
          python .github/scripts/windows_desktop.py 2>&1 | tee "reports/windows-desktop.txt"

      - name: Types under the Windows platform
        # T026-R4. The module-scoped mypy override in pyproject.toml silences errors that are
        # artefacts of checking Windows code on Linux — but it left those modules with no
        # effective type gate anywhere: bare mypy on Linux calls their post-guard bodies
        # unreachable, the Windows `check` job runs only `mypy src`, and this job ran no mypy
        # at all. A deliberate `int = "not an int"` passed everywhere.
        #
        # `--platform win32` makes the `sys.platform` guard true, so the bodies are analysed.
        #
        # No file arguments: naming files explicitly discards the config's `files`/package
        # context, and mypy then treats the first-party package and comtypes as unstubbed
        # third-party imports. The bare invocation uses pyproject.toml's scope, which is what
        # was validated locally.
        run: mypy --platform win32 2>&1 | tee "reports/mypy-win32.txt"

      - name: Windows desktop suite
        # `-m windows_desktop` is load-bearing. pytest exits 5 when it collects nothing, so a
        # marker typo or a module-level skip that silently swallows the suite turns the job
        # red instead of green-and-vacuous (T031-R2).
        run: |
          pytest -v -m windows_desktop \
            --junitxml="reports/pytest-desktop.xml" 2>&1 | tee "reports/pytest-desktop.txt"

      # --- The rest of the Windows gate (T-073) -------------------------------------------
      #
      # Everything below duplicates what `check (windows-latest)` does, because that job is
      # hosted and has not started since the Actions quota ran out — which left Phase 1's
      # "verified on Linux and Windows" criterion with nowhere to be measured. `OPS-005` made
      # this machine the platform that criterion is measured against; these steps are what let
      # it actually answer.
      #
      # It reuses the virtualenv built above rather than standing up a second job, because the
      # runner is one machine: two jobs targeting it would queue serially and pay for a second
      # checkout and install to prove the same thing.

      - name: Record the environment
        # The same artifact `check` writes, for the same reason — a Windows failure has to be
        # diagnosable without sitting at the machine.
        #
        # **ffmpeg is recorded, not installed — and since `T-189` its absence *is* a gate.**
        # `check` runs `choco install ffmpeg` because a hosted runner is discarded afterwards.
        # This one is somebody's desktop, and the rule this job already carries is that it never
        # provisions itself: the first run of it launched the real Python installer and deadlocked
        # against `msiexec` for the whole timeout. That rule is unchanged — nothing here installs
        # anything, and restoring the tool stays a deliberate maintainer act (`OPS-005`).
        #
        # What changed is the consequence of it being missing. This said *"recording is affordable
        # because the default suite does not need ffmpeg — measured on Linux with it removed from
        # PATH, the counts are identical. So this line is what says which configuration the run
        # below measured, rather than a gate."* **That stopped being true when `T108-R1` put the
        # merged-file proof in the default suite**, and `T-189` is the correction: the *Full suite*
        # step below sets `TRACKSANDTRAILS_REQUIRE_FFMPEG`, so a missing tool fails it rather than
        # skipping the one case that evidences exit criterion 2 on Windows.
        #
        # *(The counts-are-identical measurement is why the claim survived as long as it did. It
        # was taken before the merged-file case existed, and nothing re-took it — `T189-R1`.)*
        #
        # This step still records rather than gates: it says **which** configuration ran, and the
        # step below is what refuses to accept the wrong one.
        run: |
          {
            echo "runner:  self-hosted STARBASE"
            echo "ref:     ${{ github.ref }} @ ${{ github.sha }}"
            python -VV
            echo "--- ffmpeg ---"
            command -v ffmpeg || echo "ffmpeg: NOT FOUND — this run measured the no-ffmpeg configuration"
            ffmpeg -version 2>&1 | head -1 || true
            # `T-269`: the two versions that decide whether a change may land, on their own
            # lines. `pip list` already contains them, buried among sixty others — and comparing
            # two runs' formatter versions was the thing nobody could do quickly when `T-266`'s
            # round was lost to a 0.16.0/0.16.3 split. Neither number is written here; both are
            # whatever `pyproject.toml`'s exact pins installed, and
            # `tests/unit/test_toolchain_versions.py` fails if they are not.
            echo "--- gates ---"
            ruff --version
            mypy --version
            echo "--- installed ---"
            python -m pip list
          } | tee "reports/environment.txt"

      - name: Lint
        run: ruff check . 2>&1 | tee "reports/lint.txt"

      - name: Format check
        run: ruff format --check . 2>&1 | tee "reports/format.txt"

      - name: Qt baseline
        # T-002's Windows half. Offscreen by definition — it asserts PySide6 imports and builds
        # a QApplication without a display, which is the opposite of the step above it.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/qt_baseline.py 2>&1 | tee "reports/qt-baseline.txt"

      - name: Full suite
        # **Offscreen on purpose, unlike the desktop slice above.** `docs/project/TESTING.md` §2 runs the
        # UI suite headless; the real-plugin assertions are the `windows_desktop` marker's job
        # and already ran.
        #
        # This subsumes the "Process trees under the venv" step it replaces (T066-R1): the
        # `T-019` process-tree cases and `test_end_to_end.py` are both in the default run, so a
        # separate step would execute them twice. Their evidence now lives in this run's junit
        # XML — the same place `check` has always kept it.
        #
        # **This is the Windows half of T-108's merge proof, and the runner does not install
        # ffmpeg** — it records it (`OPS-005`: the maintainer's own machine, which a test run may
        # not provision). So the requirement is declared here rather than assumed: if `STARBASE`
        # ever loses the tool, `test_a_chosen_video_and_audio_pair_produce_one_merged_file` fails
        # loudly instead of skipping inside a passing job and leaving exit criterion 2 evidenced by
        # nothing (`T-189`). Restoring ffmpeg is a deliberate maintainer act, which is why this
        # fails rather than installs.
        env:
          QT_QPA_PLATFORM: offscreen
          TRACKSANDTRAILS_REQUIRE_FFMPEG: "1"
        run: pytest -v --junitxml="reports/pytest.xml" 2>&1 | tee "reports/pytest.txt"

      - name: Report any crash dump
        # `T092-R1`: **metadata only, and only dumps this run could have produced.**
        #
        # The first version copied every `.dmp` in a persistent folder and uploaded it. Three
        # problems, all real: WER is keyed by the executable *name*, so the folder collects any
        # `python.exe` on the machine and not only this project; nothing cleared or time-filtered
        # it, so a deliberate proof dump or a months-old T-074 dump would be re-uploaded on every
        # later run and announced as a recurrence; and a **full memory dump of an unrelated
        # process can carry that process's heap into a CI artifact**.
        #
        # So: report *that* a dump exists, with its name, size and timestamp, and leave the dump
        # on STARBASE for deliberate retrieval by the maintainer. Nothing sensitive leaves the
        # machine, and the causal claim is limited to what the timestamp supports.
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $folder = "$env:LOCALAPPDATA\CrashDumps\tracks-and-trails"
          New-Item -Path reports -ItemType Directory -Force | Out-Null
          $report = "reports/crashdumps.txt"
          if (-not (Test-Path $folder)) {
            "Dump capture is not armed (tools/windows/crash-dumps.ps1)." | Set-Content $report
            exit 0
          }
          # Only dumps written after this job began. `$env:JOB_STARTED_AT` is stamped by the first
          # step of the job, so anything older belongs to an earlier run or another process and
          # says nothing about this one.
          $since = [datetime]::Parse($env:JOB_STARTED_AT)
          $fresh = Get-ChildItem -Path $folder -Filter *.dmp -ErrorAction SilentlyContinue |
                   Where-Object { $_.LastWriteTime -ge $since }
          if (-not $fresh) {
            "No dump written during this run. This is the normal case." | Set-Content $report
            exit 0
          }
          $lines = @("A crash dump was written during this run. It has NOT been uploaded.",
                     "Retrieve it from $folder on STARBASE.", "")
          foreach ($dump in $fresh) {
            $lines += "{0}  {1:N0} bytes  {2:o}" -f $dump.Name, $dump.Length, $dump.LastWriteTime
          }
          $lines += ""
          $lines += "A dump here is not by itself evidence of T-074: it means some python.exe"
          $lines += "under this account faulted during the window, and WER is keyed by file name."
          $lines | Set-Content $report
          Write-Host ($lines -join "`n")

      # **`T-259`. The margin is a number in the log, not something recovered by comparing runs.**
      #
      # This bound has been crossed once already, and the way it was crossed is the reason this
      # step exists: 154 new tests walked a 30-minute bound with four minutes of headroom into two
      # consecutive timeouts, and GitHub reports a timeout as `cancelled`, so the first one read as
      # somebody having stopped the job. Nobody was watching the margin because reading it meant
      # comparing durations across runs by hand.
      #
      # **`if: always()`, because the run that most needs its duration printed is the one that
      # failed.** A step that only reports on success is absent exactly when the job is slow enough
      # to be worth measuring.
      #
      # **The decision is in Python, not in this block.** `T240-R1` is the precedent: logic written
      # in a workflow step cannot be tested where it is written, and both of that finding's
      # bypasses lived in twenty lines of `bash`. `tests/unit/test_job_duration_report.py` drives
      # the normal, warning and unreadable-stamp paths, and pins the bound below against this
      # job's own `timeout-minutes` so the two cannot drift apart.
      - name: Report the duration against the bound
        if: always()
        run: |
          python tools/job_duration_report.py \
            --started-at "$JOB_STARTED_AT" \
            --bound-minutes 40 \
            --report reports/job-duration.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-windows-desktop
          # Carries reports/screenshots/, which is retained evidence for a human to look at
          # and is not asserted on (T031-R2).
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  # **`STARBASE orphans` was removed on 2026-09-03, and this note is what it left behind.**
  #
  # It ran nightly and failed when it found a spawned worker whose parent was gone, which is what
  # `T-258` built it for: *"prevention that regresses is silent; this is what would have said so on
  # day one."* It worked. It found the same seven every night — seven processes that were being
  # **kept deliberately** as `T-268`'s only specimens — so the board was permanently red for a known
  # reason, and a genuinely new orphan would have looked exactly like it.
  #
  # **The maintainer ruled on 2026-09-03** that one occurrence in a month of watching is rare enough
  # to trade against that, and that the condition is a runner's rather than the application's. The
  # cost is stated rather than glossed: **there is now no automatic detection on the machine where
  # these accumulate.** If it recurs it will be found the way the first five were, by somebody
  # noticing the machine misbehaving.
  #
  # `docs/RUNNER_ORPHANS.md` is what to read if that happens. `tools/orphan_scan.py` still exists
  # and still runs by hand; `Linux orphans` below still runs nightly.

  # T-272. The same scan, on the other machine this project actually runs on.
  #
  # **The scanner was never Windows-specific and nobody had noticed.** `tools/orphan_scan.py` is
  # `psutil` and carries no per-platform path; it found two orphaned workers on a Linux box on
  # 2026-08-20, unmodified, on the first try — four days after they appeared, and only because
  # somebody looking at something else saw two stray processes. **Which box is not established**
  # (`T272-R6`): those PIDs are on `Spock` and the record said `kirk`, and this comment said
  # `kirk` too. The point it is making does not depend on which — the detection existed and was
  # pointed at one platform. The detection `T-258` built existed
  # and was pointed at one of the two platforms.
  #
  # **Gated on `LINUX_RUNNER` being set rather than on a separate variable**, which is the same
  # reasoning as `STARBASE_AVAILABLE` one job up rather than a shortcut around it: unset means the
  # Linux legs run on a hosted image, a hosted image is destroyed after every job, and a scan there
  # is a green check about a machine that cannot hold the condition. There is nothing to report on
  # until Linux is running somewhere with a history.
  #
  # **No persistent virtualenv to find, unlike `STARBASE`.** The Linux legs install per job, so
  # there is no environment left behind to locate — this builds a throwaway one with the single
  # dependency the scanner has. It deliberately does **not** `pip install -e ".[dev]"`: that is a
  # minute of work to run a script that needs `psutil`, and this job's whole point is that it costs
  # nothing to keep. **This is `prose.yml`'s pattern rather than a new one** — that workflow builds
  # `.venv-prose` with `pytest` alone for the same two reasons, stated there: never write into a
  # host's `site-packages`, and do not pull ~250 MB of PySide6 wheels for a job that does not import
  # them.
  linux-orphans:
    name: Linux orphans
    needs: check
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    if: >-
      ${{ always() && vars.LINUX_RUNNER != ''
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    # Seconds of work, and the bound is here for the reason the Windows one carries it: a scan
    # wedged on a process it cannot inspect must not hold a self-hosted slot indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build a throwaway environment for the scanner
        # **`python3 -m venv` rather than `actions/setup-python`**, and that is deliberate on a
        # machine somebody uses: `setup-python` deleted the tool cache out from under a running
        # job once already on these runners (run `30823595744`), and this job needs one package.
        run: |
          python3 -m venv .orphan-scan-venv
          .orphan-scan-venv/bin/python -m pip install --quiet --upgrade pip
          .orphan-scan-venv/bin/python -m pip install --quiet psutil

      - name: Scan for orphaned workers
        # **The exit code is the alarm, and is not swallowed** — the same rule the `STARBASE` job
        # states at length. A red nightly is the signal; what it is red about is the machine, and
        # reaping stays a person's decision with the report in front of them (`T258-R4`).
        run: |
          mkdir -p reports
          .orphan-scan-venv/bin/python tools/orphan_scan.py 2>&1 | tee "reports/orphan-scan.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-linux-orphans
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  # T-020. A separate job, not extra steps on `check`: the build is far slower than the test
  # suite, and folding it in would hide that cost inside T-006's ~10 minute budget. Its own
  # runtime is therefore recorded independently, which the task permits.
  #
  # This exists in Phase 0 on purpose. `freeze_support()` only matters once frozen, and the
  # failure it prevents is a recursive application launch — discovering that at Phase 5, with
  # the whole app built on ARC-002, is the outcome this job is here to avoid.
  frozen:
    # **The Windows leg runs on `STARBASE`** (`OPS-009`, maintainer ruling 2026-08-03). The
    # repository is private, Windows meters at 2x, and this job is the cheapest Windows evidence
    # to give up clean-machine independence for: it mostly answers "does the artifact run at
    # all", which a real desktop answers as well as a fresh image does. The full-suite Windows job
    # stays hosted, because that is where clean-machine coverage actually pays.
    #
    # `name` is pinned rather than derived from the label set, so the job keeps the same name in
    # the checks list whichever machine it lands on.
    name: frozen ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          # `linux` rather than a distribution name, matching `check` — see its comment. The name
          # has to stay true under both routings, and `LINUX_RUNNER` decides which is in force.
          # **What the job now measures is in `OPS-012`**: a Fedora-built artifact links Fedora's
          # glibc, so this stops being evidence that the frozen build runs on an older distro.
          # `REL-001`'s release build is Phase 5 and must revisit where Linux artifacts are
          # produced. Historical citations of `frozen ubuntu-latest` in the coordination documents stay as
          # written —
          # those runs did happen on Ubuntu (`AGENTS.md` §6).
          - name: linux
            runner: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
          - name: windows
            runner: [self-hosted, windows, desktop]

    defaults:
      run:
        shell: bash

    # **A per-run profile, because this job runs a real application on a machine somebody uses**
    # (`T-298`). The frozen artifact is a *spawned process*, so the test suite's module patching
    # cannot reach it and only the environment half of `tests/user_directories.py` applies. Left
    # alone it resolves the runner account's real Tracks & Trails directory — and on `Spock` that
    # holds the maintainer's own in-app yt-dlp update, which `OPS-002` says an application should
    # prefer over its bundled baseline. It duly did, and the bundled-baseline probe failed:
    # `frozen linux` was green on `kirk` and red on `Spock` at the same code head, run
    # `33231536419`. The gate was reading a profile, not the artifact.
    #
    # **Both families are set on both legs, and neither is redundant.** `platformdirs` consults
    # `XDG_*` only on POSIX and `WIN_PD_OVERRIDE_*` only on Windows — `T-131` is the round where
    # setting one of them passed on Linux and failed on the runner. The inapplicable pair is inert,
    # and a conditional here would be a second thing to keep true.
    #
    # **`run_id` and `run_attempt` are what make it fresh**, not `runner.temp`: that is a stable
    # directory on a self-hosted machine, so without them a re-run would inherit the previous
    # attempt's installed copy and the update probe would start from a state it did not create.
    #
    # **This changes no product behaviour.** `OPS-002`'s preference is unchanged; the artifact
    # still resolves a user-managed copy ahead of its baseline. What changes is whose profile the
    # build gate looks in. `tests/unit/test_frozen_isolation.py` pins the wiring.
    steps:
      - uses: actions/checkout@v7

      - name: Give this job its own user profile
        # **Exported here rather than declared in a job-level `env:`, and that is not a style
        # choice.** The first version of this put all six in `jobs.frozen.env` using
        # `${{ runner.temp }}`; GitHub rejected the whole file at validation — zero jobs, no logs,
        # the run named after the path because a workflow that does not parse has no name. The
        # `runner` context does not exist at job level, because the runner has not been assigned
        # when that block is evaluated. `yaml.safe_load` cannot catch it; only GitHub's schema can.
        #
        # `$GITHUB_ENV` reaches every later step, so this is still one declaration, and
        # `$RUNNER_TEMP` is the same directory by its environment-variable spelling, which *is*
        # available once a step is running.
        #
        # Created explicitly rather than left to the artifact: a probe that fails because a parent
        # directory is missing would read as a packaging defect, which is the class of confusion
        # `T014-R3` exists to prevent. This is also the one place that says out loud which profile
        # the probes below will use, so a run's log answers it without inference.
        run: |
          profile="$RUNNER_TEMP/frozen-profile-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$profile"/{data,config,cache,windows}
          {
            echo "FROZEN_PROFILE=$profile"
            echo "XDG_DATA_HOME=$profile/data"
            echo "XDG_CONFIG_HOME=$profile/config"
            echo "XDG_CACHE_HOME=$profile/cache"
            echo "WIN_PD_OVERRIDE_APPDATA=$profile/windows"
            echo "WIN_PD_OVERRIDE_LOCAL_APPDATA=$profile/windows"
          } >> "$GITHUB_ENV"
          echo "frozen profile: $profile"
          echo "real profile untouched; see T-298"

      # **Hosted runners only.** `OPS-009` moved the Windows leg onto `STARBASE` and left this
      # action behind, which repeated the incident the desktop job's own comment records: on a
      # machine somebody uses, `setup-python` runs the real installer. It deleted the tool-cache
      # interpreter and then failed the reinstall — run `30823595744`, "Error happened during
      # Python installation". A self-hosted runner must not provision itself as a side effect of
      # running a build, so the Windows leg uses the Python already on the machine, exactly as
      # the desktop job does.
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the machine's Python
        if: runner.environment != 'github-hosted'
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      # Same position as the `check` job's copy (`OPS-012`): installed on a hosted image, verified
      # on a machine somebody uses. PyInstaller imports Qt to collect it, so a missing library here
      # fails the *build* rather than a test, which is an even worse place to discover it.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          else
            echo "self-hosted: not installing system packages; verifying what is present"
            missing=""
            for lib in libEGL.so.1 libGL.so.1 libxkbcommon.so.0 libdbus-1.so.3 libfontconfig.so.1; do
              ldconfig -p | grep -q "$lib" && echo "  $lib: present" || { echo "  $lib: MISSING"; missing="$missing $lib"; }
            done
            if [ -n "$missing" ]; then
              echo "::error::Missing Qt runtime libraries:$missing"
              echo "::error::On Fedora: sudo dnf install -y mesa-libEGL mesa-libGL libxkbcommon dbus-libs fontconfig"
              exit 1
            fi
          fi

      # T-066: the suite runs in a virtualenv, because `docs/DEVELOPMENT.md` tells developers
      # to use one and a gate that measures a different environment is measuring the wrong
      # thing. On Windows this is not cosmetic: `python -m venv` installs a *launcher* as
      # `Scripts/python.exe` which spawns the real interpreter as a child, so every
      # `multiprocessing` spawn sits one generation deeper than it does without a venv. That is
      # the tree shape `T-019`'s descendant reaping is about, and until now no job produced it.
      #
      # Testing the deeper tree is the superset: reaping that works with the extra level works
      # without it.
      #
      # Adding the venv to GITHUB_PATH rather than calling it by path in every step keeps the
      # commands below identical to the ones `docs/project/TESTING.md` §4 publishes.
      - name: Create the virtualenv
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            # `shell: bash` on a Windows runner is Git Bash, where $PWD is an MSYS path
            # (/d/a/repo/repo). GITHUB_PATH is consumed by the runner itself and needs a
            # native path, so this converts rather than echoing what bash would print.
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the project and the build extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Build the frozen artifact
        working-directory: packaging
        run: |
          mkdir -p ../reports
          SECONDS=0
          pyinstaller --noconfirm --clean \
            --distpath ../dist --workpath ../build tracks-and-trails.spec \
            2>&1 | tee "../reports/pyinstaller.txt"
          echo "build seconds: $SECONDS" | tee -a "../reports/frozen-timing.txt"

      - name: Record the artifact size
        # T033-R1's size delta. **Deliberately before the probe, not after.**
        #
        # The delta is a comparison between two builds: the normal one and a collection-removal
        # run whose probe is *expected* to fail. Ordered after the probe, that second run
        # skipped this step entirely and could never supply the "without yt-dlp" half of the
        # comparison — the step measuring the difference was skipped in exactly the run that
        # defines it.
        #
        # `if: always()` as well as the ordering, so a probe failure for any other reason still
        # leaves the size evidence behind.
        if: always()
        run: |
          {
            echo "platform: ${{ matrix.name }}"
            echo "ref: ${{ github.sha }}"
            du -sk dist/tracks-and-trails | awk '{print "artifact KiB: " $1}'
            find dist/tracks-and-trails -path '*yt_dlp*' -type f \
              | wc -l | awk '{print "yt_dlp files: " $1}'
            find dist/tracks-and-trails -path '*yt_dlp*' -type f -exec du -k {} + \
              | awk '{total += $1} END {print "yt_dlp KiB: " total+0}'
          } 2>&1 | tee "reports/artifact-size.txt"

      - name: Assert the frozen artifact carries yt-dlp and its extractors
        # T-033. Importing yt_dlp is not the test: the core alone imports fine, and the
        # artifact then fails every URL as if the site had broken. This resolves an extractor
        # through the lazy machinery PyInstaller's static analysis cannot see.
        #
        # T033-R1: it also asserts the bundled version against the pin in pyproject.toml.
        # Printing the version was not checking it — a stale or wrong yt-dlp produced exactly
        # the same "lots of extractors" output that a correct one does.
        #
        # T033-R2: and it now *instantiates* the named extractor. Resolving the name returns a
        # class from the generated lazy table, which imports no extractor code at all — with
        # the real module unimportable this step still reported 1751 extractors and exit 0
        # while every matching URL would have failed. Instantiation forces the real import.
        run: |
          BIN=dist/tracks-and-trails/tracks-and-trails
          [ -f "$BIN" ] || BIN=dist/tracks-and-trails/tracks-and-trails.exe
          "$BIN" --ytdlp-probe 2>&1 | tee "reports/ytdlp-probe.txt"

      - name: Verify the frozen artifact can create its database
        # T014-R3. The migrations are .sql files and PyInstaller follows imports, so they are
        # collected only if the spec names them. When it does not, the failure is quiet: the
        # migration directory is simply absent, the database is created at version 0 with no
        # tables, and the first write fails with "no such table: jobs" — which reads as a code
        # bug rather than a packaging one, on the platform where OPS-003 says failures are
        # diagnosed from this log and nothing else.
        #
        # Collecting the files in the spec is not the gate; this is. It creates a real database
        # and writes a real job through the real repository, inside the artifact.
        run: |
          BIN=dist/tracks-and-trails/tracks-and-trails
          [ -f "$BIN" ] || BIN=dist/tracks-and-trails/tracks-and-trails.exe
          "$BIN" --database-probe 2>&1 | tee "reports/database-probe.txt"

      - name: Verify an in-app yt-dlp update works inside the frozen artifact
        # T198-R2. The steps above build the artifact, probe its bundled baseline and run the
        # generic spawn smoke — none of them ever invokes the updater, resolves an installed
        # copy in a spawned child, or reverts. Two green frozen jobs therefore said nothing
        # about T-198's criterion 4, and docs/project/TESTING.md's release-gate item 10 names the missing
        # sequence independently: download, extract, resolve the new version, revert.
        #
        # This runs that sequence inside the artifact, on both platforms, through the same
        # install_latest / resolve_in_a_child / revert_to_baseline the button calls. The index
        # is served from memory: a gate must not depend on PyPI being reachable, and what is
        # being proved is where the install lands, not that HTTP works.
        #
        # It does not prove a download runs on the installed copy — that is criterion 2, proved
        # against a real yt-dlp and a real transfer in tests/integration/test_end_to_end.py.
        run: |
          BIN=dist/tracks-and-trails/tracks-and-trails
          [ -f "$BIN" ] || BIN=dist/tracks-and-trails/tracks-and-trails.exe
          "$BIN" --ytdlp-update-probe 2>&1 | tee "reports/ytdlp-update-probe.txt"

      - name: Smoke-test the frozen artifact
        # Asserts: launches, spawns a child, exchanges one message, exits zero, runs exactly
        # one top-level application process, and leaves no orphan behind.
        run: |
          SECONDS=0
          python packaging/frozen_smoke.py dist/tracks-and-trails 2>&1 | tee "reports/frozen-smoke.txt"
          echo "smoke seconds: $SECONDS" | tee -a "reports/frozen-timing.txt"

      - name: Remove this job's profile
        # `always()`, and on the self-hosted machines this is the point of it: `runner.temp`
        # survives the job there, so every frozen run would otherwise leave a profile holding a
        # downloaded yt-dlp behind. A gate that isolates itself by quietly filling a disk has
        # traded one machine-state problem for another.
        if: always()
        run: rm -rf "$FROZEN_PROFILE" || true

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # `matrix.name`, because `OPS-009` replaced `matrix.os` and left three references to
          # it behind. Both legs then uploaded to `frozen-evidence-`, so the matrix's two
          # artifacts became one — run `30823595744` produced a single unnamed-leg artifact.
          name: frozen-evidence-${{ matrix.name }}
          # The raw probe log is written next to the artifact by frozen_smoke.py, not at the
          # repository root — the previous path silently uploaded nothing (`T029-R3`).
          path: |
            reports/
            dist/frozen-probe.log
          retention-days: 30
          if-no-files-found: warn
