# Build, gate and **draft** a release. Never publish (`T-324`).
#
# **`push: tags` and nothing else.** `ci.yml` remains the per-push smoke; this runs only when a
# `v*` tag appears. No `workflow_dispatch`, because a release has exactly one legitimate trigger
# and a dispatchable one invites a draft built from an untagged tree. No `pull_request` or
# `pull_request_target` ever — `SECURITY.md` §CI trust boundary makes that the control that keeps
# a fork's code off the maintainer's machines, and `tests/unit/test_workflow_triggers.py` fails
# if either appears.
name: release

on:
  push:
    tags:
      - "v*"

# **Read-only by default, widened in exactly one job.** `SECURITY.md` requires every workflow to
# declare `contents: read` at the top level; the `draft` job below re-declares
# `contents: write` for itself and no other job inherits it. That is the one place this project's
# CI trust boundary widens, and it widens by one scope, for one job, to create a draft.
permissions:
  contents: read

# A release build must not be cancelled by anything, including a second tag: a half-built draft
# is the one artifact nobody can tell apart from a finished one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  # Step 1 of T-324's scope, and it runs alone so nothing is built against a tag that is wrong.
  verify:
    name: the tag agrees with the tree
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # **Full history.** The ancestry check below needs it, and `ci.yml`'s shallow clone is
          # what `T-331` records costing a session's diagnosis when a check silently had no
          # commits to look at.
          fetch-depth: 0

      # **`"3.14"`, as `ci.yml` pins it** (`T-324`, found by the first `v0.1.0` run). This read
      # `python-version-file: .python-version`, a file this repository has never had, so the
      # first real run stopped here before checking anything.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: The tag matches __version__
        # `REL-003` fixes the version in `__init__.py`. `tools/version_tag_check.py` is that rule
        # as a function with a CLI, refusing a mismatch, a `.devN` commit, and seven tag
        # spellings the decision did not take.
        run: python tools/version_tag_check.py --tag "$GITHUB_REF_NAME"

      - name: The tag is on main
        # A tag on a branch nobody reviewed would build and draft exactly like a real one.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      - name: The changelog has a section for this version
        # Checked here rather than in the `draft` job, because discovering it after two builds
        # wastes the builds — and because a draft with an empty body is worse than a stop.
        run: python tools/changelog_section.py --version "${GITHUB_REF_NAME#v}"

  # ---------------------------------------------------------------------------------------------
  build-linux:
    name: AppImage
    needs: verify
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v6

      # **The gate below runs on the runner, not in the container**, and imports
      # `tracks_and_trails.core.logging`, which is Python 3.14 source. A hosted Ubuntu runner's own
      # `python` is older and cannot parse it. Hosted only, for `ci.yml`'s reason: a self-hosted
      # runner is not provisioned by a build (`OPS-012` §3), so its Python is checked instead.
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14"

      - name: Check the machine's Python
        if: runner.environment != 'github-hosted'
        run: python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Build in the oldest-glibc container
        # **Not on the runner.** `REL-004` requires building against the oldest glibc the README
        # claims, and `OPS-012` measured why: the development machine is glibc 2.43, so an
        # AppImage built there fails on every current LTS while passing every test run there.
        # `packaging/build_appimage.sh` carries that reasoning and the container it needs.
        run: |
          mkdir -p dist
          podman run --rm -v "$PWD":/src:ro,Z -v "$PWD/dist":/out:Z \
            docker.io/library/python:3.14-slim-bookworm /src/packaging/build_appimage.sh

      - name: The gates, over the payload that shipped
        # `build_appimage.sh` already gates the AppDir it assembles. This re-gates what came out,
        # because the thing that ships is the `.AppImage` and `T-323`'s history is a gate that
        # passed with its subject removed.
        run: |
          artifact=$(ls dist/*.AppImage)
          chmod +x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          python packaging/artifact_gates.py squashfs-root/usr/bin

      - name: The probes, on the release build
        run: |
          artifact=$(ls dist/*.AppImage)
          for probe in --spawn-probe --ytdlp-probe --database-probe --ytdlp-update-probe; do
            echo "--- $probe"
            "$artifact" "$probe"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  build-windows:
    name: installer
    needs: verify
    runs-on: [self-hosted, windows, desktop]
    steps:
      - uses: actions/checkout@v6

      - name: The tools this build does not install
        # **`OPS-012` §3: a self-hosted runner must not provision itself as a side effect of a
        # build.** Inno Setup is placed on `STARBASE` by a deliberate maintainer act, so this
        # checks and **fails** rather than installing it — a build that silently installed a
        # compiler would make the machine's state a function of whoever pushed a tag.
        #
        # **Three locations, because one was wrong** (`T-322`). This looked only at
        # `C:\Program Files (x86)` and would have reported Inno Setup missing on a machine that
        # had it: `winget install JRSoftware.InnoSetup` installs **per-user**, under
        # `%LOCALAPPDATA%\Programs\Inno Setup 6\`. Measured on `STARBASE` 2026-09-12. The path
        # is exported so the compile step uses what was actually found rather than guessing again.
        run: |
          for candidate in \
              "$LOCALAPPDATA/Programs/Inno Setup 6/ISCC.exe" \
              "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
              "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -x "$candidate" ]; then
              echo "ISCC=$candidate" >> "$GITHUB_ENV"
              echo "found $candidate"
              exit 0
            fi
          done
          if command -v ISCC >/dev/null 2>&1; then
            echo "ISCC=$(command -v ISCC)" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Inno Setup's ISCC.exe is not on this machine."
          echo "::error::Install it by hand per OPS-012 section 3 -- winget install --id JRSoftware.InnoSetup -e"
          exit 1

      # **A profile and a virtualenv of this job's own, as `ci.yml`'s `frozen` job has them**
      # (`T-324`, found by reading the workflow after its first run failed). This installed the
      # project into `STARBASE`'s own Python, which is a build changing the machine (`OPS-012`
      # §3), and ran the probes against the maintainer's real profile (`T-298`).
      - name: Give this job its own user profile
        run: |
          profile="$RUNNER_TEMP/release-profile-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$profile"/{data,config,cache,windows}
          {
            echo "XDG_DATA_HOME=$profile/data"
            echo "XDG_CONFIG_HOME=$profile/config"
            echo "XDG_CACHE_HOME=$profile/cache"
            echo "WIN_PD_OVERRIDE_APPDATA=$profile/windows"
            echo "WIN_PD_OVERRIDE_LOCAL_APPDATA=$profile/windows"
          } >> "$GITHUB_ENV"
          echo "RELEASE_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "release profile: $profile"

      - name: Check the machine's Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Create the virtualenv
        run: |
          python -m venv .venv
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Install the project and the build extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Fetch the pinned ffmpeg
        # **A named step, not a side effect.** `packaging/tracks-and-trails.spec` deliberately
        # does not fetch anything — `OPS-012` §3 is about a *build* changing the machine. This is
        # a reviewable step in a workflow a human reads, downloading one pinned archive into the
        # workspace and verifying its SHA-256 before extracting. `LIC-001` decides which archive:
        # an LGPL shared build, never a GPL one.
        run: python packaging/fetch_ffmpeg.py

      - name: Build the windowed artifact
        working-directory: packaging
        env:
          TT_RELEASE_BUILD: "1"
        run: pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build tracks-and-trails.spec

      - name: The gates, over the release build
        run: python packaging/artifact_gates.py dist/tracks-and-trails

      - name: The probes, on the release build
        # **`console=False` means no `stdout`**, which is the whole reason `_freeze_probe.say`
        # writes to `TT_PROBE_REPORT`. `windowed_checks.py` gives each probe its own report file,
        # discards the console, and fails a probe whose report lacks its success line.
        #
        # **`--ffmpeg-probe` is among them** (`T324-R2`). It was missing here, although it exists
        # to catch exactly the release-only defect `T-319` found — ffmpeg bundled where the
        # application does not look — and none of the other probes touches ffmpeg.
        run: |
          mkdir -p reports
          python packaging/windowed_checks.py probes dist/tracks-and-trails \
            2>&1 | tee reports/release-probes.txt

      - name: Compile the installer
        # The version comes from the tag, which `verify` has already proved equals `__version__`.
        # The script refuses to compile without it rather than defaulting (`REL-003`), and derives
        # its own numeric `VersionInfoVersion` — Inno rejects a PEP 440 string outright, which the
        # first compile found (`T-322`).
        #
        # `$ISCC` is whatever the step above actually located, not a path guessed here.
        run: |
          "$ISCC" "/DAppVersion=${GITHUB_REF_NAME#v}" \
            "/DSourceDir=..\\dist\\tracks-and-trails" packaging/tracks-and-trails.iss

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          # **Where `tracks-and-trails.iss`'s `OutputDir=..\dist` puts it** (`T324-R1`). This said
          # `packaging/Output/*.exe`, Inno's default, which the script overrides — so a real
          # release run would have reached this step with nothing to upload and never drafted.
          # `tests/unit/test_release_workflow.py` resolves the script's output against this glob.
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Remove this job's profile
        if: always()
        run: rm -rf "$RELEASE_PROFILE" || true

  # ---------------------------------------------------------------------------------------------
  draft:
    name: draft the release
    needs: [build-linux, build-windows]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    # **The one widened scope in this project's CI.** Nothing above it has write access and
    # nothing below it inherits this.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # **`"3.14"`, as `ci.yml` pins it** (`T-324`, found by the first `v0.1.0` run). This read
      # `python-version-file: .python-version`, a file this repository has never had, so the
      # first real run stopped here before checking anything.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v6
        with:
          path: incoming

      - name: Collect the artifacts and checksum them
        run: |
          mkdir -p release
          find incoming -type f \( -name '*.AppImage' -o -name '*.exe' \) -exec cp {} release/ \;
          cd release
          # Both artifacts, or neither. A release missing a platform is a release nobody notices
          # is missing a platform.
          test -n "$(ls *.AppImage 2>/dev/null)" || { echo "::error::no AppImage"; exit 1; }
          test -n "$(ls *.exe 2>/dev/null)" || { echo "::error::no installer"; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Draft it, and never publish it
        # **`--draft` is not a default here, it is the point** (`T-324`). Publishing is a human
        # click after `T-328`'s release review, which is the only place a release is inspected
        # before it is public. The assertion below is the gate on that: if a future edit ever
        # drops `--draft`, this step fails rather than announcing a release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/changelog_section.py --version "${GITHUB_REF_NAME#v}" > body.md
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            release/*
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$state" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is not a draft. Nothing in this project publishes."
            exit 1
          fi
          echo "drafted $GITHUB_REF_NAME; publishing is a human act after the T-328 review"
