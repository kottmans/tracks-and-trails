# T-074. Runs the suite N times on `STARBASE` and reports how many times it crashed.
#
# **A separate workflow, and manual only.** `ci.yml` runs on every push and must stay a gate; this
# is an instrument. Putting it there would mean either paying its cost on every push or adding a
# conditional to a job whose whole value is that it runs unconditionally.
#
# `T-074`'s acceptance criteria ask for the failure to be **reproduced deliberately, with a rate,
# rather than waited for**. Four ordinary CI runs gave "about one in four", which is an
# observation and not a measurement: the denominator was however many times the gate happened to
# run. This job makes the denominator a choice.
#
# It does not stop on the first crash. A rate needs every iteration attempted, and the failures
# that matter here are intermittent by definition — stopping early would turn a rate back into an
# anecdote.
name: T-074 repeat

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to run the full suite"
        required: false
        default: "10"
      target:
        description: "pytest target; leave blank for the whole suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  repeat:
    name: repeat on STARBASE
    runs-on: [self-hosted, windows, desktop]
    # Ten full-suite runs at roughly three and a half minutes each, plus setup. Generous because
    # the failure mode under investigation is a crash, and a job killed by its own timeout would
    # be indistinguishable from the thing being measured.
    timeout-minutes: 90

    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Stamp the job start time
        # `T092-R1`: the crash-dump report filters on this, so a dump from an earlier run or an
        # unrelated process cannot be attributed to this one.
        if: always()
        shell: pwsh
        run: |
          "JOB_STARTED_AT=$([datetime]::UtcNow.ToString('o'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@v7

      # Same reasoning as the `windows desktop` job: this runner is a machine somebody uses, and
      # a workflow must never provision it. See `ci.yml` for what installing Python here cost.
      - name: Check the machine's Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Create the virtualenv
        run: |
          python -m venv .venv
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite repeatedly
        # **The inputs arrive as environment variables, not as `${{ }}` inside the script**, which
        # is what `flake-soak.yml` and `starbase-orphan-inspect.yml` already do and what this file
        # did not. An input interpolated into a `run:` block is substituted before bash sees it,
        # so its content becomes shell source on a **self-hosted Windows desktop**; through `env:`
        # it is only ever data. Dispatching needs write access, so this was a habit rather than a
        # hole — and the habit is what stops the hole existing the day a trigger changes.
        env:
          ITERATIONS_INPUT: ${{ inputs.iterations }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          mkdir -p reports
          ITERATIONS="$ITERATIONS_INPUT"
          TARGET="$TARGET_INPUT"
          crashes=0
          failures=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "=== iteration $i of $ITERATIONS ==="
            set +e
            pytest -q $TARGET > "reports/run-$i.txt" 2>&1
            code=$?
            set -e
            tail -3 "reports/run-$i.txt"
            # pytest exits 1 for ordinary test failures. A crash takes the interpreter with it,
            # so the exit code is a signal or an access violation -- anything but 0 or 1. That
            # distinction is the whole point: T-074 is not a failing assertion.
            if [ "$code" -eq 0 ]; then
              echo "iteration $i: pass"
            elif [ "$code" -eq 1 ]; then
              failures=$((failures + 1)); echo "iteration $i: TEST FAILURE (exit 1)"
            else
              crashes=$((crashes + 1)); echo "iteration $i: CRASH (exit $code)"
            fi
          done
          {
            echo "iterations: $ITERATIONS"
            echo "crashes:    $crashes"
            echo "failures:   $failures"
          } | tee "reports/t074-rate.txt"

      - name: Report any crash dump
        # `T092-R1`: **metadata only, and only dumps this run could have produced.**
        #
        # The first version copied every `.dmp` in a persistent folder and uploaded it. Three
        # problems, all real: WER is keyed by the executable *name*, so the folder collects any
        # `python.exe` on the machine and not only this project; nothing cleared or time-filtered
        # it, so a deliberate proof dump or a months-old T-074 dump would be re-uploaded on every
        # later run and announced as a recurrence; and a **full memory dump of an unrelated
        # process can carry that process's heap into a CI artifact**.
        #
        # So: report *that* a dump exists, with its name, size and timestamp, and leave the dump
        # on STARBASE for deliberate retrieval by the maintainer. Nothing sensitive leaves the
        # machine, and the causal claim is limited to what the timestamp supports.
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $folder = "$env:LOCALAPPDATA\CrashDumps\tracks-and-trails"
          New-Item -Path reports -ItemType Directory -Force | Out-Null
          $report = "reports/crashdumps.txt"
          if (-not (Test-Path $folder)) {
            "Dump capture is not armed (tools/windows/crash-dumps.ps1)." | Set-Content $report
            exit 0
          }
          # Only dumps written after this job began. `$env:JOB_STARTED_AT` is stamped by the first
          # step of the job, so anything older belongs to an earlier run or another process and
          # says nothing about this one.
          $since = [datetime]::Parse($env:JOB_STARTED_AT)
          $fresh = Get-ChildItem -Path $folder -Filter *.dmp -ErrorAction SilentlyContinue |
                   Where-Object { $_.LastWriteTime -ge $since }
          if (-not $fresh) {
            "No dump written during this run. This is the normal case." | Set-Content $report
            exit 0
          }
          $lines = @("A crash dump was written during this run. It has NOT been uploaded.",
                     "Retrieve it from $folder on STARBASE.", "")
          foreach ($dump in $fresh) {
            $lines += "{0}  {1:N0} bytes  {2:o}" -f $dump.Name, $dump.Length, $dump.LastWriteTime
          }
          $lines += ""
          $lines += "A dump here is not by itself evidence of T-074: it means some python.exe"
          $lines += "under this account faulted during the window, and WER is keyed by file name."
          $lines | Set-Content $report
          Write-Host ($lines -join "`n")

      - name: Upload every run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t074-repeat
          path: reports/
          retention-days: 30
          if-no-files-found: warn
